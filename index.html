<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pet</title>
<style>
  :root{--bg:#0b0c10;--panel:#141619;--accent:#00ff41;--text:#8a8f98;--border:#2a2d32;--danger:#ff4444;--warn:#ffaa00}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Courier New',monospace;padding:1.5rem;min-height:100vh}
  .container{max-width:800px;margin:0 auto}
  h1{color:var(--accent);text-transform:uppercase;letter-spacing:3px;font-size:1.5rem;margin:0 0 1.2rem;border-bottom:1px solid var(--border);padding-bottom:.7rem;text-align:center}
  
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.8rem;margin:1rem 0}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem}
  label{display:block;margin-bottom:.3rem;font-size:.65rem;color:#556;text-transform:uppercase;letter-spacing:1px}
  input,select{background:var(--panel);border:1px solid var(--border);color:var(--accent);padding:.5rem;width:100%;box-sizing:border-box;font-family:inherit;border-radius:2px}
  input[type="color"]{height:36px;padding:2px;cursor:pointer}
  input[type="range"]{width:100%;accent-color:var(--accent)}
  
  button{background:#1a1d22;border:1px solid var(--accent);color:var(--accent);padding:.6rem;width:100%;font-weight:bold;cursor:pointer;text-transform:uppercase;letter-spacing:1px;transition:all .2s;margin-top:.5rem;border-radius:2px}
  button:hover{background:var(--accent);color:#000}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.secondary{border-color:var(--border);color:var(--text);background:var(--panel)}
  button.secondary:hover{border-color:var(--accent);color:var(--accent)}
  button.danger{border-color:var(--danger);color:var(--danger)}
  button.danger:hover{background:var(--danger);color:#000}
  
  #preview{width:100%;height:300px;background:#0f1114;border:1px solid var(--border);position:relative;overflow:hidden;margin:1.2rem 0;border-radius:4px;transition:filter .3s}
  #preview::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.4) 100%);pointer-events:none}
  
  #output-wrap{position:relative;background:#08090a;border:1px solid var(--border);padding:1rem;border-radius:4px}
  #embed-text{margin:0;font-size:.6rem;color:#667;overflow-x:auto;white-space:pre-wrap;word-break:break-all;min-height:120px;max-height:200px;line-height:1.4}
  
  /* Pet UI Components */
  .wp-ui{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.7);padding:6px 10px;border-radius:4px;font-size:.65rem;color:var(--accent);pointer-events:none;border:1px solid #333;min-width:200px;z-index:15}
  .wp-stats{display:flex;gap:8px;flex-wrap:wrap}
  .wp-stat{display:flex;align-items:center;gap:4px}
  .wp-bar{width:40px;height:4px;background:#333;border-radius:2px;overflow:hidden}
  .wp-bar-fill{height:100%;background:var(--accent);transition:width .2s,background .2s}
  .wp-bar-fill.hunger{background:var(--accent)}
  .wp-bar-fill.energy{background:var(--warn)}
  .wp-bar-fill.health{background:var(--danger)}
  
  .wp-pet{position:absolute;width:64px;height:56px;cursor:grab;--pc:#00ff41;transition:transform .1s,filter .2s;user-select:none;z-index:10}
  .wp-pet:active{cursor:grabbing}
  .wp-pet svg{width:100%;height:100%;transition:fill .2s}
  .wp-pet .eye{fill:#000;opacity:.85;transition:fill .2s}
  .wp-pet:hover .eye{fill:var(--pc);opacity:1}
  .wp-pet.hunt{filter:drop-shadow(0 0 8px var(--pc));animation:huntPulse .5s infinite alternate}
  .wp-pet.sleep{opacity:.6;filter:grayscale(.6)}
  .wp-pet.happy{animation:happyBounce .4s ease-in-out}
  .wp-pet.angry{filter:drop-shadow(0 0 4px #ff4444)}
  .wp-pet.sick{filter:grayscale(1) brightness(.8);opacity:.7}
  .wp-pet .tail{transition:transform .2s}
  .wp-pet.wag .tail{animation:wag .3s infinite alternate}
  .wp-pet.idle{animation:breathe 3s infinite ease-in-out}
  
  @keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.04)}}
  @keyframes wag{0%{transform:rotate(-15deg)}100%{transform:rotate(15deg)}}
  @keyframes huntPulse{0%{filter:drop-shadow(0 0 4px var(--pc))}100%{filter:drop-shadow(0 0 12px var(--pc))}}
  @keyframes happyBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  
  .float-text{position:absolute;color:#fff;font-weight:bold;font-size:.75rem;pointer-events:none;animation:floatUp .8s forwards;text-shadow:0 0 4px #000;z-index:20}
  @keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-30px)}}
  
  .particle{position:absolute;width:4px;height:4px;background:var(--pc);border-radius:50%;pointer-events:none;animation:particle .6s forwards}
  @keyframes particle{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(0) translateY(-20px)}}
  
  .bubble{position:absolute;background:#fff;color:#000;padding:4px 8px;border-radius:8px;font-size:.65rem;max-width:120px;text-align:center;animation:bubbleFade 2s forwards;z-index:15;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .bubble::after{content:'';position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);border-width:4px 4px 0;border-style:solid;border-color:#fff transparent transparent transparent}
  @keyframes bubbleFade{0%{opacity:0;transform:translateY(5px)}10%{opacity:1;transform:translateY(0)}90%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-10px)}}
  
  .weather{position:absolute;top:8px;right:8px;font-size:.7rem;color:#888;pointer-events:none;z-index:15;display:flex;align-items:center;gap:4px}
  .weather-icon{font-size:1rem}
  
  .achievement{position:absolute;bottom:8px;left:8px;background:linear-gradient(90deg,#00ff4122,#00ff4144);border:1px solid var(--accent);padding:4px 8px;font-size:.6rem;color:var(--accent);border-radius:3px;animation:achSlide .5s ease-out;z-index:25}
  @keyframes achSlide{0%{transform:translateX(-100%)}100%{transform:translateX(0)}}
  
  .action-bar{display:flex;gap:.5rem;margin:.8rem 0;flex-wrap:wrap}
  .action-btn{flex:1;min-width:80px;padding:.4rem;font-size:.7rem}
  
  .status-indicator{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .status-online{background:var(--accent)}
  .status-away{background:var(--warn)}
  .status-offline{background:var(--danger)}
  
  .mini-map{position:absolute;bottom:8px;right:8px;width:80px;height:60px;background:rgba(0,0,0,.6);border:1px solid var(--border);border-radius:3px;overflow:hidden;z-index:15}
  .mini-map-dot{position:absolute;width:3px;height:3px;background:var(--accent);border-radius:50%;transition:left .1s,top .1s}
  
  .save-indicator{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(0,255,65,.1);border:1px solid var(--accent);padding:2px 8px;font-size:.6rem;color:var(--accent);border-radius:3px;opacity:0;transition:opacity .3s;z-index:20}
  .save-indicator.show{opacity:1}
  
  .theme-preview{display:flex;gap:4px;margin-top:.3rem}
  .theme-dot{width:16px;height:16px;border-radius:50%;border:1px solid #444;cursor:pointer;transition:transform .1s}
  .theme-dot:hover{transform:scale(1.2)}
  .theme-dot.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
  
  @media(max-width:600px){
    .grid{grid-template-columns:1fr 1fr}
    .grid-3{grid-template-columns:1fr}
    #preview{height:250px}
  }
</style>
</head>
<body>
<div class="container">
  <h1>Pet</h1>
  
  <div class="grid">
    <div><label>Callsign</label><input id="name" type="text" value="ALPHA_01" maxlength="12" pattern="[A-Za-z0-9_]+"></div>
    <div><label>Color Táctico</label><input id="color" type="color" value="#00ff41"></div>
    <div><label>Agresividad</label><select id="aggro">
      <option value="low">Baja (Patrulla)</option>
      <option value="med" selected>Media (Caza)</option>
      <option value="high">Alta (Asalto)</option>
    </select></div>
    <div><label>Tema</label><select id="theme">
      <option value="matrix">Matrix</option>
      <option value="fire">Fuego</option>
      <option value="ice">Hielo</option>
      <option value="gold">Oro</option>
      <option value="stealth">Stealth</option>
    </select></div>
  </div>
  
  <div class="grid-3">
    <div><label>Tamaño</label><input id="size" type="range" min="40" max="100" value="64"></div>
    <div><label>Vel. Animación</label><input id="animSpeed" type="range" min="0.5" max="2" step="0.1" value="1"></div>
    <div><label>Sonidos</label><select id="sound">
      <option value="on">Activados</option>
      <option value="off" selected>Silencio</option>
    </select></div>
  </div>
  
  <div class="action-bar">
    <button class="action-btn secondary" onclick="feedPet()">🍖 Alimentar</button>
    <button class="action-btn secondary" onclick="trainPet()">⚡ Entrenar</button>
    <button class="action-btn secondary" onclick="restPet()">😴 Descansar</button>
    <button class="action-btn danger" onclick="resetPet()">↺ Reset</button>
  </div>
  
  <button onclick="generate()">▶ GENERAR EMBED</button>
  
  <div id="preview">
    <div class="save-indicator" id="save-indicator">✓ Auto-guardado</div>
    <div class="wp-ui" id="preview-stats">
      <div class="wp-stats">
        <div class="wp-stat"><span class="status-indicator status-online"></span><span id="stat-name">ALPHA_01</span></div>
        <div class="wp-stat">LVL:<span id="stat-lvl">1</span></div>
        <div class="wp-stat">XP:<span id="stat-xp">0</span></div>
      </div>
      <div style="margin-top:4px;display:flex;gap:8px;flex-wrap:wrap">
        <div class="wp-stat"><span>H</span><div class="wp-bar"><div class="wp-bar-fill hunger" id="bar-hunger" style="width:100%"></div></div></div>
        <div class="wp-stat"><span>E</span><div class="wp-bar"><div class="wp-bar-fill energy" id="bar-energy" style="width:100%"></div></div></div>
        <div class="wp-stat"><span>♥</span><div class="wp-bar"><div class="wp-bar-fill health" id="bar-health" style="width:100%"></div></div></div>
      </div>
      <div style="margin-top:4px;font-size:.6rem">Estado: <span id="stat-mood">Neutral</span></div>
    </div>
    <div class="weather" id="preview-weather"><span class="weather-icon">☀️</span><span id="weather-text">Día</span></div>
    <div id="preview-wolf" class="wp-pet idle"></div>
    <div class="mini-map" id="mini-map"><div class="mini-map-dot" id="map-dot"></div></div>
  </div>
  
  <div id="output-wrap">
    <pre id="embed-text">[Pulsa "GENERAR EMBED" para crear tu código]</pre>
  </div>
  
  <div style="margin-top:1rem;font-size:.7rem;color:#556;text-align:center">
    <small>💡 Tip: Arrastra la mascota para moverla. Click para interactuar. Los datos se guardan automáticamente en el embed generado.</small>
  </div>
</div>

<script>
  const WOLF_SVG = `<svg viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
    <path d="M88 32 L78 18 L68 28 L58 12 L48 22 L38 8 L28 22 L18 12 L8 32 L18 48 L12 64 L28 58 L38 72 L52 76 L66 72 L76 58 L92 64 L88 48 Z" class="body"/>
    <circle cx="38" cy="36" r="2.5" class="eye"/>
    <circle cx="62" cy="36" r="2.5" class="eye"/>
    <path d="M62 62 Q76 68 86 56" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" class="tail"/>
    <path d="M20 45 L30 42 M80 45 L70 42" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".6" class="ear"/>
  </svg>`;

  const THEMES = {
    matrix: {color:'#00ff41',bg:'#0f1114',glow:'rgba(0,255,65,.3)'},
    fire: {color:'#ff4400',bg:'#1a0a05',glow:'rgba(255,68,0,.3)'},
    ice: {color:'#00ccff',bg:'#05101a',glow:'rgba(0,204,255,.3)'},
    gold: {color:'#ffcc00',bg:'#1a1505',glow:'rgba(255,204,0,.3)'},
    stealth: {color:'#666',bg:'#0a0a0f',glow:'rgba(100,100,100,.2)'}
  };

  const MOODS = {Neutral:0,Happy:1,Angry:2,Excited:3,Sleepy:4,Hungry:5,Sick:6};
  const VOICE_LINES = {
    Neutral:['...','*sniff*','*observa*'],
    Happy:['*mueve cola*','¡Buen trabajo!','*contento*'],
    Angry:['*gruñe*','Grrr...','*muestra dientes*'],
    Excited:['*ladra*','¡Vamos!','*energético*'],
    Sleepy:['*zzz*','...cansado...','*bosteza*'],
    Hungry:['*gime*','Comida...','*hambriento*'],
    Sick:['*tos*','...mal...','*débil*']
  };
  
  const ACHIEVEMENTS = [
    {id:'first_pet',name:'Primer Contacto',desc:'Interactúa con tu mascota'},
    {id:'level_5',name:'Veterano',desc:'Alcanza nivel 5'},
    {id:'level_10',name:'Alfa',desc:'Alcanza nivel 10'},
    {id:'full_stats',name:'Óptimo',desc:'Mantén todas las barras al 100%'},
    {id:'night_owl',name:'Nocturno',desc:'Juega de noche'},
    {id:'clicks_50',name:'Dedicado',desc:'50 interacciones'},
    {id:'survivor',name:'Superviviente',desc:'Mantén salud >50% por 2 min'}
  ];

  const preview = document.getElementById('preview-wolf');
  const area = document.getElementById('preview');
  const mapDot = document.getElementById('map-dot');
  let cfg = {name:'ALPHA_01',color:'#00ff41',aggro:'med',theme:'matrix',size:64,animSpeed:1,sound:'off'};
  let state = { 
    lvl:1, xp:0, hunger:100, energy:100, health:100, mood:'Neutral', 
    pos:{x:100,y:100}, vel:{x:2,y:1}, dragging:false, dragOff:{x:0,y:0},
    huntMode:false, isNight:false, clickCount:0, playTime:0, lastInteraction:0,
    achievements:[], isSick:false, cooldown:0
  };
  let lastTime = 0, moodTimer = 0, weatherTimer = 0, saveTimer = 0;
  let audioCtx = null;

  function initAudio(){
    if(cfg.sound==='off' || !window.AudioContext) return;
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  }
  
  function playSound(freq=440,duration=0.1,type='sine'){
    if(cfg.sound==='off' || !audioCtx) return;
    try{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.frequency.value = freq; osc.type = type;
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.start(); osc.stop(audioCtx.currentTime + duration);
    }catch(e){}
  }

  function sync(){
    cfg.name = (document.getElementById('name').value.replace(/\s/g,'_')||'PET').substring(0,12);
    cfg.color = document.getElementById('color').value;
    cfg.aggro = document.getElementById('aggro').value;
    cfg.theme = document.getElementById('theme').value;
    cfg.size = parseInt(document.getElementById('size').value);
    cfg.animSpeed = parseFloat(document.getElementById('animSpeed').value);
    cfg.sound = document.getElementById('sound').value;
    
    const theme = THEMES[cfg.theme];
    preview.style.setProperty('--pc', cfg.color);
    preview.style.setProperty('animation-duration', `${3/cfg.animSpeed}s`);
    area.style.background = theme.bg;
    area.style.boxShadow = `inset 0 0 30px ${theme.glow}`;
    
    // FIX: Aplicar color directamente al SVG
    applyPetColor(cfg.color);
    
    // Actualizar UI
    document.getElementById('stat-name').textContent = cfg.name;
    document.getElementById('preview-wolf').style.width = cfg.size+'px';
    document.getElementById('preview-wolf').style.height = (cfg.size*0.875)+'px';
    updateStats();
    triggerSaveIndicator();
  }

  function applyPetColor(color){
    // Aplicar color a todos los elementos SVG que lo necesiten
    const svg = preview.querySelector('svg');
    if(!svg) return;
    svg.querySelectorAll('.body').forEach(el => el.style.fill = color);
    svg.querySelectorAll('.eye').forEach(el => el.style.fill = '#000');
    svg.querySelectorAll('.tail,.ear').forEach(el => {
      el.style.stroke = color;
      el.style.setProperty('currentColor', color);
    });
    // Fallback: establecer variable CSS y fill global
    preview.style.setProperty('--pc', color);
    svg.style.fill = color;
  }

  function updateStats(){
    document.getElementById('stat-lvl').textContent = state.lvl;
    document.getElementById('stat-xp').textContent = state.xp;
    document.getElementById('bar-hunger').style.width = state.hunger+'%';
    document.getElementById('bar-energy').style.width = state.energy+'%';
    document.getElementById('bar-health').style.width = state.health+'%';
    document.getElementById('stat-mood').textContent = state.mood;
    
    // Actualizar colores de barras según estado
    document.getElementById('bar-hunger').style.background = state.hunger<30 ? 'var(--danger)' : 'var(--accent)';
    document.getElementById('bar-energy').style.background = state.energy<30 ? 'var(--danger)' : 'var(--warn)';
    document.getElementById('bar-health').style.background = state.health<40 ? 'var(--danger)' : (state.health<70 ? 'var(--warn)' : 'var(--accent)');
    
    // Actualizar mini-mapa
    const mx = area.clientWidth - 64, my = area.clientHeight - 56;
    mapDot.style.left = (state.pos.x / mx * 74)+'px';
    mapDot.style.top = (state.pos.y / my * 54)+'px';
  }

  function triggerSaveIndicator(){
    const ind = document.getElementById('save-indicator');
    ind.classList.add('show');
    setTimeout(()=>ind.classList.remove('show'), 1500);
  }

  function spawnParticle(x,y,color){
    for(let i=0;i<5;i++){
      const p=document.createElement('div');
      p.className='particle';
      p.style.left=(x+Math.random()*30)+'px';
      p.style.top=(y+Math.random()*30)+'px';
      p.style.setProperty('--pc', color||cfg.color);
      area.appendChild(p);
      setTimeout(()=>p.remove(),600);
    }
  }

  function spawnFloat(txt,x,y,color){
    const el=document.createElement('div');
    el.className='float-text';
    el.textContent=txt;
    el.style.left=x+'px';
    el.style.top=y+'px';
    if(color) el.style.color=color;
    area.appendChild(el);
    setTimeout(()=>el.remove(),800);
  }

  function spawnBubble(text,x,y){
    const b=document.createElement('div');
    b.className='bubble';
    b.textContent=text;
    b.style.left=(x-40)+'px';
    b.style.top=(y-30)+'px';
    area.appendChild(b);
    setTimeout(()=>b.remove(),2000);
  }

  function unlockAchievement(id){
    if(state.achievements.includes(id)) return;
    const ach = ACHIEVEMENTS.find(a=>a.id===id);
    if(!ach) return;
    state.achievements.push(id);
    const el=document.createElement('div');
    el.className='achievement';
    el.innerHTML=`🏆 ${ach.name}<br><small style="color:#888">${ach.desc}</small>`;
    area.appendChild(el);
    setTimeout(()=>el.remove(),3500);
    playSound(660,0.15,'square');
  }

  function changeMood(newMood){
    if(state.mood === newMood && newMood!=='Neutral') return;
    state.mood = newMood;
    preview.classList.remove('happy','angry','sleep','sick');
    
    if(newMood==='Happy') {preview.classList.add('happy'); playSound(520,0.08);}
    else if(newMood==='Angry') {preview.classList.add('angry'); playSound(180,0.1,'sawtooth');}
    else if(newMood==='Sleepy' || newMood==='Hungry') preview.classList.add('sleep');
    else if(newMood==='Sick') {preview.classList.add('sick'); playSound(120,0.2,'sine');}
    else preview.classList.add('idle');
  }

  function feedPet(){
    if(state.cooldown>0 || state.hunger>=100) return;
    state.hunger = Math.min(100, state.hunger+25);
    state.energy = Math.max(0, state.energy-5);
    state.xp += 8;
    changeMood('Happy');
    spawnBubble('¡Ñam!', state.pos.x+32, state.pos.y);
    spawnFloat('+25H', state.pos.x+10, state.pos.y-10, '#00ff41');
    playSound(340,0.1);
    state.cooldown = 2;
    checkLevelUp();
  }

  function trainPet(){
    if(state.cooldown>0 || state.energy<15) return;
    state.energy = Math.max(0, state.energy-20);
    state.hunger = Math.max(0, state.hunger-10);
    state.xp += 25;
    changeMood('Excited');
    spawnBubble('¡Entrenando!', state.pos.x+32, state.pos.y);
    spawnFloat('+25XP', state.pos.x+10, state.pos.y-10, '#00ff41');
    playSound(440,0.1,'triangle');
    state.cooldown = 3;
    checkLevelUp();
  }

  function restPet(){
    if(state.cooldown>0) return;
    state.energy = Math.min(100, state.energy+30);
    state.health = Math.min(100, state.health+10);
    changeMood('Sleepy');
    spawnBubble('Zzz...', state.pos.x+32, state.pos.y);
    spawnFloat('+30E', state.pos.x+10, state.pos.y-10, '#ffaa00');
    playSound(220,0.15,'sine');
    state.cooldown = 2.5;
  }

  function resetPet(){
    if(!confirm('¿Resetear mascota a estado inicial?')) return;
    state = {...state, lvl:1, xp:0, hunger:100, energy:100, health:100, mood:'Neutral', pos:{x:100,y:100}, achievements:[]};
    changeMood('Neutral');
    updateStats();
    spawnFloat('RESET', area.clientWidth/2, area.clientHeight/2, '#ff4444');
    playSound(100,0.3,'sawtooth');
  }

  function checkLevelUp(){
    if(state.xp >= state.lvl * 50){
      state.lvl++;
      state.xp = 0;
      spawnFloat('¡NIVEL UP!', state.pos.x+10, state.pos.y-30, '#00ff41');
      for(let i=0;i<15;i++) setTimeout(()=>spawnParticle(state.pos.x+32, state.pos.y+28), i*40);
      playSound(880,0.2,'square');
      if(state.lvl===5) unlockAchievement('level_5');
      if(state.lvl===10) unlockAchievement('level_10');
    }
  }

  // Event listeners para inputs
  ['input','change'].forEach(e=>{
    document.querySelectorAll('input,select').forEach(i=>i.addEventListener(e,()=>{sync(); initAudio();}));
  });

  function startPreview(){
    preview.innerHTML = WOLF_SVG;
    applyPetColor(cfg.color);
    state.pos = {x:area.clientWidth/2-32, y:area.clientHeight/2-28};
    
    function loop(now){
      const dt = Math.min((now-lastTime)/1000, 0.1);
      lastTime = now;
      state.playTime += dt;
      if(state.cooldown>0) state.cooldown -= dt;
      
      if(!state.dragging){
        const speed = (cfg.aggro==='high'?180:cfg.aggro==='med'?120:70) * cfg.animSpeed;
        const changeChance = (cfg.aggro==='high'?0.02:cfg.aggro==='med'?0.012:0.006) * cfg.animSpeed;
        
        if(Math.random()<changeChance){
          state.vel.x = (Math.random()-.5)*speed;
          state.vel.y = (Math.random()-.5)*speed;
          state.huntMode = Math.random()<0.3;
          preview.classList.toggle('hunt', state.huntMode && !preview.classList.contains('sleep'));
        }
        
        state.pos.x += state.vel.x * dt;
        state.pos.y += state.vel.y * dt;
        
        const mx=area.clientWidth-64, my=area.clientHeight-56;
        if(state.pos.x<=0){state.pos.x=0;state.vel.x*=-1}
        if(state.pos.x>=mx){state.pos.x=mx;state.vel.x*=-1}
        if(state.pos.y<=0){state.pos.y=0;state.vel.y*=-1}
        if(state.pos.y>=my){state.pos.y=my;state.vel.y*=-1}
        
        // Sistema de estadísticas
        const decay = cfg.aggro==='high' ? 2.5 : cfg.aggro==='med' ? 1.5 : 0.8;
        state.hunger = Math.max(0, state.hunger - dt*decay);
        state.energy = Math.max(0, state.energy - dt*decay*0.7);
        
        // Salud: baja si hambre o energía muy bajas
        if(state.hunger<20 || state.energy<20) state.health = Math.max(0, state.health - dt*0.5);
        else if(state.hunger>80 && state.energy>80) state.health = Math.min(100, state.health + dt*0.3);
        
        // Enfermedad aleatoria si salud baja
        if(state.health<30 && Math.random()<0.002 && !state.isSick){
          state.isSick = true;
          changeMood('Sick');
          unlockAchievement('survivor');
        }
        
        // Sistema de estado de ánimo
        moodTimer += dt;
        if(moodTimer > 6/cfg.animSpeed){
          moodTimer = 0;
          if(state.isSick) changeMood('Sick');
          else if(state.hunger<25) changeMood('Hungry');
          else if(state.energy<20) changeMood('Sleepy');
          else if(state.health<50) changeMood('Sick');
          else if(Math.random()<0.35) changeMood('Happy');
          else if(Math.random()<0.15) changeMood('Angry');
          else changeMood('Neutral');
          
          // Burbuja de voz
          if(!preview.classList.contains('sleep') && Math.random()<0.4){
            const lines = VOICE_LINES[state.mood]||VOICE_LINES.Neutral;
            spawnBubble(lines[Math.floor(Math.random()*lines.length)], state.pos.x+32, state.pos.y);
          }
        }
        
        // Ciclo día/noche
        weatherTimer += dt;
        if(weatherTimer > 25){
          weatherTimer = 0;
          state.isNight = !state.isNight;
          document.getElementById('weather-text').textContent = state.isNight?'Noche':'Día';
          document.querySelector('.weather-icon').textContent = state.isNight?'🌙':'☀️';
          area.style.filter = state.isNight?'brightness(0.65)':'brightness(1)';
          if(state.isNight) unlockAchievement('night_owl');
        }
        
        // Actualizar visual
        preview.style.left = state.pos.x+'px';
        preview.style.top = state.pos.y+'px';
        preview.style.transform = `scaleX(${state.vel.x>=0?1:-1})`;
        preview.classList.toggle('idle', Math.abs(state.vel.x)<15 && !state.huntMode && !preview.classList.contains('sleep'));
        
        // Auto-guardado visual cada 10s
        saveTimer += dt;
        if(saveTimer > 10){
          saveTimer = 0;
          triggerSaveIndicator();
        }
        
        updateStats();
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }

  // Controles de arrastre
  preview.addEventListener('mousedown',e=>{
    if(e.target.closest('.wp-ui') || e.target.closest('.weather')) return;
    state.dragging=true;
    const r=area.getBoundingClientRect();
    state.dragOff = {x:e.clientX-r.left-state.pos.x, y:e.clientY-r.top-state.pos.y};
    preview.style.transition='none';
    preview.classList.remove('idle');
    initAudio();
  });
  
  window.addEventListener('mouseup',()=>{
    if(state.dragging){
      state.dragging=false;
      preview.style.transition=`transform .1s, filter .2s`;
      state.vel = {x:(Math.random()-.5)*50, y:(Math.random()-.5)*50};
    }
  });
  
  window.addEventListener('mousemove',e=>{
    if(!state.dragging)return;
    const r=area.getBoundingClientRect();
    state.pos.x = Math.max(0, Math.min(area.clientWidth-64, e.clientX-r.left-state.dragOff.x));
    state.pos.y = Math.max(0, Math.min(area.clientHeight-56, e.clientY-r.top-state.dragOff.y));
    preview.style.left = state.pos.x+'px';
    preview.style.top = state.pos.y+'px';
  });

  // Interacción con click
  preview.addEventListener('click',e=>{
    if(state.dragging || state.cooldown>0) return;
    const rect=preview.getBoundingClientRect();
    const x=e.clientX-rect.left;
    const y=e.clientY-rect.top;
    
    state.clickCount++;
    if(state.clickCount>=50) unlockAchievement('clicks_50');
    if(state.clickCount===1) unlockAchievement('first_pet');
    
    spawnParticle(x+state.pos.x, y+state.pos.y, cfg.color);
    initAudio();
    
    const actions = [
      {t:'CARICIA +5XP',xp:5,h:-3,e:4,m:'Happy',v:'*contento*',s:520},
      {t:'JUGAR +12',xp:12,h:-8,e:-10,m:'Excited',v:'¡Vamos!',s:660},
      {t:'ORDEN +8',xp:8,h:-5,e:-6,m:'Neutral',v:'*atento*',s:380}
    ];
    const act = actions[Math.floor(Math.random()*actions.length)];
    
    state.xp += act.xp;
    state.hunger = Math.max(0, state.hunger+act.h);
    state.energy = Math.max(0, state.energy+act.e);
    if(state.energy>85) state.health = Math.min(100, state.health+2);
    
    changeMood(act.m);
    if(act.v) spawnBubble(act.v, state.pos.x+32, state.pos.y);
    playSound(act.s, 0.08);
    
    if(state.xp >= state.lvl*50){
      checkLevelUp();
    } else {
      spawnFloat(act.t, state.pos.x+10, state.pos.y-10, '#fff');
    }
    
    preview.classList.add('wag');
    setTimeout(()=>preview.classList.remove('wag'),600);
    state.cooldown = 0.8;
    updateStats();
  });

    const changeRate = (cfg.aggro==='high'?0.025:cfg.aggro==='med'?0.015:0.008) * cfg.animSpeed;
    const petSize = cfg.size;
    
    const embed = `<!-- PET WIDGET v4 -->

  // Inicialización
  sync();
  startPreview();
  
  // Prevenir selección de texto al arrastrar
  document.addEventListener('selectstart', e => {
    if(state.dragging) e.preventDefault();
  });
