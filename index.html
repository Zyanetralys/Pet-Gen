<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WOLF PET // TACTICAL v4</title>
<style>
  :root{--bg:#0b0c10;--panel:#141619;--accent:#00ff41;--text:#8a8f98;--border:#2a2d32}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Courier New',monospace;padding:1.5rem;min-height:100vh}
  .container{max-width:750px;margin:0 auto}
  h1{color:var(--accent);text-transform:uppercase;letter-spacing:2px;font-size:1.3rem;margin:0 0 1rem;border-bottom:1px solid var(--border);padding-bottom:.6rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.8rem;margin:1rem 0}
  label{display:block;margin-bottom:.3rem;font-size:.7rem;color:#556;text-transform:uppercase}
  input,select{background:var(--panel);border:1px solid var(--border);color:var(--accent);padding:.5rem;width:100%;box-sizing:border-box;font-family:inherit}
  button{background:#1a1d22;border:1px solid var(--accent);color:var(--accent);padding:.6rem;width:100%;font-weight:bold;cursor:pointer;text-transform:uppercase;letter-spacing:1px;transition:all .2s;margin-top:.5rem}
  button:hover{background:var(--accent);color:#000}
  #preview{width:100%;height:300px;background:#0f1114;border:1px solid var(--border);position:relative;overflow:hidden;margin:1.2rem 0;border-radius:4px;cursor:crosshair}
  #output-wrap{position:relative;background:#08090a;border:1px solid var(--border);padding:.8rem;border-radius:4px}
  #embed-text{margin:0;font-size:.65rem;color:#667;overflow-x:auto;white-space:pre-wrap;word-break:break-all;min-height:100px;max-height:180px}
  .copy-btn{position:absolute;top:.4rem;right:.4rem;background:#222;border:1px solid #444;color:#aaa;padding:.2rem .5rem;font-size:.6rem;cursor:pointer;border-radius:2px}
  .copy-btn:hover{background:#333;color:#fff}
  
  .wp-ui{position:absolute;top:8px;left:8px;background:#000d;padding:6px 8px;border-radius:4px;font-size:.6rem;color:var(--accent);pointer-events:none;border:1px solid #333;width:160px}
  .bar{height:4px;background:#222;border-radius:2px;margin:3px 0;overflow:hidden}
  .bar-fill{height:100%;background:var(--accent);transition:width .3s}
  .wp-pet{position:absolute;width:64px;height:56px;cursor:grab;--pc:#00ff41;transition:transform .1s,filter .2s;user-select:none;z-index:10}
  .wp-pet:active{cursor:grabbing}
  .wp-pet svg{width:100%;height:100%;fill:var(--pc);transition:fill .2s}
  .wp-pet .eye{fill:#000;opacity:.85}
  .wp-pet:hover .eye{fill:var(--pc);opacity:1}
  .wp-pet.hunt{filter:drop-shadow(0 0 8px var(--pc));animation:hp .4s infinite alternate}
  .wp-pet.sleep{opacity:.5;filter:grayscale(.8)}
  .wp-pet.happy{animation:hb .4s ease-in-out}
  .wp-pet.angry{filter:drop-shadow(0 0 4px #f00)}
  .wp-pet.wag .tail{animation:wag .3s infinite alternate}
  .wp-pet.idle{animation:br 3s infinite ease-in-out}
  @keyframes hp{0%{filter:drop-shadow(0 0 4px var(--pc))}100%{filter:drop-shadow(0 0 12px var(--pc))}}
  @keyframes hb{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @keyframes wag{0%{transform:rotate(-15deg)}100%{transform:rotate(15deg)}}
  @keyframes br{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.04)}}
  .float-text{position:absolute;color:#fff;font-weight:bold;font-size:.75rem;pointer-events:none;animation:fu .8s forwards;text-shadow:0 0 4px #000;z-index:20}
  @keyframes fu{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-30px)}}
  .particle{position:absolute;width:4px;height:4px;background:var(--pc);border-radius:50%;pointer-events:none;animation:pt .6s forwards}
  @keyframes pt{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(0) translateY(-20px)}}
  .bubble{position:absolute;background:#fff;color:#000;padding:4px 8px;border-radius:8px;font-size:.6rem;max-width:120px;text-align:center;animation:bf 2s forwards;z-index:15;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .bubble::after{content:'';position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);border-width:4px 4px 0;border-style:solid;border-color:#fff transparent transparent transparent}
  @keyframes bf{0%{opacity:0;transform:translateY(5px)}10%{opacity:1;transform:translateY(0)}90%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-10px)}}
  .weather{position:absolute;top:8px;right:8px;font-size:.7rem;color:#888;pointer-events:none}
  .achievement{position:absolute;bottom:8px;left:8px;background:linear-gradient(90deg,#0f42,#0a44);border:1px solid var(--accent);padding:3px 6px;font-size:.6rem;color:var(--accent);border-radius:3px;animation:as .5s ease-out}
  @keyframes as{0%{transform:translateX(-100%)}100%{transform:translateX(0)}}
  .feed-btn{position:absolute;bottom:8px;right:8px;background:#222;border:1px solid #444;color:#aaa;padding:2px 6px;font-size:.55rem;cursor:pointer;border-radius:2px}
  .feed-btn:hover{background:#333;color:#fff}
</style>
</head>
<body>
<div class="container">
  <h1>WOLF PET // TACTICAL v4</h1>
  <div class="grid">
    <div><label>CALLSIGN</label><input id="name" type="text" value="ALPHA_01" maxlength="12"></div>
    <div><label>COLOR TÁCTICO</label><input id="color" type="color" value="#00ff41"></div>
    <div><label>AGRESIVIDAD</label><select id="aggro">
      <option value="low">Baja (Lento/Pasivo)</option>
      <option value="med" selected>Media (Ágil/Reactivo)</option>
      <option value="high">Alta (Rápido/Errático)</option>
    </select></div>
    <div><label>MODO OPERATIVO</label><select id="mode">
      <option value="patrol" selected>Patrulla Autónoma</option>
      <option value="loyalty">Lealtad (Persigue Cursor)</option>
    </select></div>
  </div>
  <button onclick="generate()">GENERAR EMBED</button>
  
  <div id="preview">
    <div class="wp-ui" id="preview-stats">
      <div>LVL:1 | XP:0</div>
      <div class="bar"><div class="bar-fill" id="bar-h" style="width:100%"></div></div>
      <div class="bar"><div class="bar-fill" id="bar-e" style="width:100%"></div></div>
      <div class="bar"><div class="bar-fill" id="bar-l" style="width:100%"></div></div>
    </div>
    <div class="weather" id="preview-weather">☀️ Día</div>
    <div id="preview-wolf" class="wp-pet idle"></div>
    <button class="feed-btn" onclick="feedPet()">RACIÓN [+HUNGER]</button>
  </div>
  
  <div id="output-wrap">
    <pre id="embed-text">[CÓDIGO EMBED AQUÍ]</pre>
    <button class="copy-btn" onclick="copyToClipboard()">COPIAR</button>
  </div>
</div>

<script>
  const WOLF_SVG = `<svg viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
    <path d="M88 32 L78 18 L68 28 L58 12 L48 22 L38 8 L28 22 L18 12 L8 32 L18 48 L12 64 L28 58 L38 72 L52 76 L66 72 L76 58 L92 64 L88 48 Z"/>
    <circle cx="38" cy="36" r="2.5" class="eye"/>
    <circle cx="62" cy="36" r="2.5" class="eye"/>
    <path d="M62 62 Q76 68 86 56" fill="none" stroke="var(--pc)" stroke-width="2.5" stroke-linecap="round" class="tail"/>
    <path d="M20 45 L30 42 M80 45 L70 42" fill="none" stroke="var(--pc)" stroke-width="1.5" opacity=".6"/>
  </svg>`;

  const THEMES = {
    matrix: {color:'#00ff41',bg:'#0f1114'},
    fire: {color:'#ff4400',bg:'#1a0a05'},
    ice: {color:'#00ccff',bg:'#05101a'},
    gold: {color:'#ffcc00',bg:'#1a1505'}
  };

  const AGGRO_PHYSICS = {
    low: {maxSpd:70, accel:0.4, friction:0.94, turnRate:0.005},
    med: {maxSpd:130, accel:1.0, friction:0.91, turnRate:0.012},
    high: {maxSpd:210, accel:2.2, friction:0.87, turnRate:0.025}
  };

  const preview = document.getElementById('preview-wolf');
  const area = document.getElementById('preview');
  const statsEl = document.getElementById('preview-stats');
  const weatherEl = document.getElementById('preview-weather');
  const barH = document.getElementById('bar-h');
  const barE = document.getElementById('bar-e');
  const barL = document.getElementById('bar-l');
  
  let cfg = { name:'ALPHA_01', color:'#00ff41', aggro:'med', mode:'patrol', theme:'matrix' };
  let state = { 
    lvl:1, xp:0, hunger:100, energy:100, loyalty:100, mood:'Neutral', 
    pos:{x:150,y:150}, vel:{x:0,y:0}, dragging:false, 
    huntMode:false, isNight:false, clickCount:0, playTime:0,
    achievements:[], mouse:{x:0,y:0}
  };
  let lastTime = 0, moodTimer = 0, weatherTimer = 0;

  function sync(){
    cfg.name = document.getElementById('name').value.replace(/\s/g,'_')||'PET';
    cfg.color = document.getElementById('color').value;
    cfg.aggro = document.getElementById('aggro').value;
    cfg.mode = document.getElementById('mode').value;
    cfg.theme = document.getElementById('theme')?.value || 'matrix';
    const theme = THEMES[cfg.theme];
    preview.style.setProperty('--pc',theme.color);
    area.style.background = theme.bg;
    updateStats();
  }

  function updateStats(){
    statsEl.querySelector('div').textContent = `LVL:${state.lvl}|XP:${state.xp}`;
    barH.style.width = Math.max(0,state.hunger)+'%';
    barE.style.width = Math.max(0,state.energy)+'%';
    barL.style.width = Math.max(0,state.loyalty)+'%';
    weatherEl.textContent = state.isNight?' Noche':'☀️ Día';
  }

  function spawnParticle(x,y){
    for(let i=0;i<6;i++){
      const p=document.createElement('div');
      p.className='particle';
      p.style.left=(x+Math.random()*40-20)+'px';
      p.style.top=(y+Math.random()*40-20)+'px';
      p.style.setProperty('--pc',cfg.color);
      area.appendChild(p);
      setTimeout(()=>p.remove(),600);
    }
  }

  function spawnFloat(txt,x,y,color){
    const el=document.createElement('div');
    el.className='float-text'; el.textContent=txt;
    el.style.left=x+'px'; el.style.top=y+'px';
    if(color) el.style.color=color;
    area.appendChild(el); setTimeout(()=>el.remove(),800);
  }

  function spawnBubble(text,x,y){
    const b=document.createElement('div');
    b.className='bubble'; b.textContent=text;
    b.style.left=(x-40)+'px'; b.style.top=(y-30)+'px';
    area.appendChild(b); setTimeout(()=>b.remove(),2000);
  }

  function unlockAchievement(id,name){
    if(state.achievements.includes(id)) return;
    state.achievements.push(id);
    const el=document.createElement('div');
    el.className='achievement';
    el.innerHTML=`🏆 ${name}`;
    area.appendChild(el);
    setTimeout(()=>el.remove(),3000);
  }

  function changeMood(newMood){
    state.mood = newMood;
    preview.classList.remove('happy','angry','sleep');
    if(newMood==='Happy') preview.classList.add('happy');
    else if(newMood==='Angry') preview.classList.add('angry');
    else if(newMood==='Sleepy') preview.classList.add('sleep');
  }

  ['input','change'].forEach(e=>{
    document.querySelectorAll('input,select').forEach(i=>i.addEventListener(e,sync));
  });

  // Mouse tracking
  area.addEventListener('mousemove', e=>{
    const r=area.getBoundingClientRect();
    state.mouse.x = e.clientX - r.left;
    state.mouse.y = e.clientY - r.top;
  });

  function startPreview(){
    preview.innerHTML = WOLF_SVG;
    state.pos = {x:area.clientWidth/2-32, y:area.clientHeight/2-28};
    
    function loop(now){
      const dt = Math.min((now-lastTime)/1000, 0.1);
      lastTime = now;
      state.playTime += dt;
      
      if(!state.dragging){
        const phys = AGGRO_PHYSICS[cfg.aggro];
        
        if(cfg.mode === 'patrol'){
          if(Math.random()<phys.turnRate){
            state.vel.x = (Math.random()-.5)*phys.maxSpd;
            state.vel.y = (Math.random()-.5)*phys.maxSpd;
            state.huntMode = Math.random()<0.3;
            preview.classList.toggle('hunt',state.huntMode);
          }
        } else {
          // Loyalty mode: chase mouse
          const dx = state.mouse.x - (state.pos.x+32);
          const dy = state.mouse.y - (state.pos.y+28);
          const dist = Math.sqrt(dx*dx+dy*dy);
          
          if(dist > 10){
            const nx = dx/dist, ny = dy/dist;
            state.vel.x += nx * phys.accel * dt * 60;
            state.vel.y += ny * phys.accel * dt * 60;
            state.huntMode = dist < 80;
            preview.classList.toggle('hunt', state.huntMode);
            state.loyalty = Math.min(100, state.loyalty + dt*0.5);
          } else {
            state.huntMode = false;
            preview.classList.remove('hunt');
            if(Math.random()<0.02) spawnBubble('*wags*', state.pos.x+32, state.pos.y);
          }
        }
        
        // Apply friction & clamp speed
        state.vel.x *= phys.friction;
        state.vel.y *= phys.friction;
        const spd = Math.sqrt(state.vel.x**2 + state.vel.y**2);
        if(spd > phys.maxSpd){
          state.vel.x = (state.vel.x/spd)*phys.maxSpd;
          state.vel.y = (state.vel.y/spd)*phys.maxSpd;
        }
        
        state.pos.x += state.vel.x * dt;
        state.pos.y += state.vel.y * dt;
        
        const mx=area.clientWidth-64, my=area.clientHeight-56;
        if(state.pos.x<=0){state.pos.x=0;state.vel.x*=-0.5}
        if(state.pos.x>=mx){state.pos.x=mx;state.vel.x*=-0.5}
        if(state.pos.y<=0){state.pos.y=0;state.vel.y*=-0.5}
        if(state.pos.y>=my){state.pos.y=my;state.vel.y*=-0.5}
        
        // Decay
        state.hunger = Math.max(0, state.hunger - dt*1.2);
        state.energy = Math.max(0, state.energy - dt*0.6);
        
        // Mood logic
        moodTimer += dt;
        if(moodTimer > 7){
          moodTimer = 0;
          if(state.hunger<25) changeMood('Hungry');
          else if(state.energy<15) changeMood('Sleepy');
          else if(cfg.mode==='loyalty' && state.loyalty>80) changeMood('Happy');
          else if(Math.random()<0.3) changeMood('Happy');
          else if(Math.random()<0.15) changeMood('Angry');
          else changeMood('Neutral');
          
          const lines = {Neutral:['...','*sniff*'],Happy:['*wags*','Good!'],Angry:['*growl*','Grr...'],Excited:['*barks*','Go!'],Sleepy:['*zzz*','...'],Hungry:['Food...','*whine*']};
          const moodKey = state.mood==='Neutral'?'Neutral':state.mood==='Happy'?'Happy':state.mood==='Angry'?'Angry':state.mood==='Sleepy'?'Sleepy':'Hungry';
          if(Math.random()<0.4) spawnBubble(lines[moodKey][Math.floor(Math.random()*lines[moodKey].length)], state.pos.x+32, state.pos.y);
        }
        
        // Day/Night
        weatherTimer += dt;
        if(weatherTimer > 25){
          weatherTimer = 0;
          state.isNight = !state.isNight;
          area.style.filter = state.isNight?'brightness(0.6)':'brightness(1)';
          if(state.isNight) unlockAchievement('night_owl','Night Owl');
        }
        
        if(state.hunger<25) preview.classList.add('sleep');
        else preview.classList.remove('sleep');
        
        preview.style.left = state.pos.x+'px';
        preview.style.top = state.pos.y+'px';
        preview.style.transform = `scaleX(${state.vel.x>=0?1:-1})`;
        preview.classList.toggle('idle', Math.abs(state.vel.x)<8 && !state.huntMode);
        updateStats();
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }

  // Drag
  preview.addEventListener('mousedown',e=>{
    state.dragging=true;
    const r=area.getBoundingClientRect();
    state.dragOff = {x:e.clientX-r.left-state.pos.x, y:e.clientY-r.top-state.pos.y};
    preview.style.transition='none';
    preview.classList.remove('idle');
  });
  window.addEventListener('mouseup',()=>{
    if(state.dragging){state.dragging=false;preview.style.transition='transform .1s,filter .2s';}
  });
  window.addEventListener('mousemove',e=>{
    if(!state.dragging)return;
    const r=area.getBoundingClientRect();
    state.pos.x = e.clientX-r.left-state.dragOff.x;
    state.pos.y = e.clientY-r.top-state.dragOff.y;
    preview.style.left = state.pos.x+'px';
    preview.style.top = state.pos.y+'px';
  });

  // Click
  preview.addEventListener('click',e=>{
    if(state.dragging)return;
    const rect=preview.getBoundingClientRect();
    const x=e.clientX-rect.left, y=e.clientY-rect.top;
    state.clickCount++;
    if(state.clickCount>=50) unlockAchievement('clicks50','Dedicated');
    
    spawnParticle(x+state.pos.x,y+state.pos.y);
    const actions = [
      {t:'PET +5XP',xp:5,h:-2,e:5,m:'Happy',v:'*happy*',l:2},
      {t:'FEED +15',xp:10,h:20,e:-3,m:'Happy',v:'*nom*',l:0},
      {t:'TRAIN +20',xp:20,h:-8,e:-12,m:'Excited',v:'Go!',l:5}
    ];
    const act = actions[Math.floor(Math.random()*actions.length)];
    state.xp += act.xp;
    state.hunger = Math.min(100, state.hunger+act.h);
    state.energy = Math.min(100, state.energy+act.e);
    state.loyalty = Math.min(100, state.loyalty+act.l);
    changeMood(act.m);
    spawnBubble(act.v, state.pos.x+32, state.pos.y);
    
    if(state.xp >= state.lvl*50){
      state.lvl++; state.xp=0;
      spawnFloat('LEVEL UP!', state.pos.x+10, state.pos.y-30, '#0f0');
      for(let i=0;i<15;i++) setTimeout(()=>spawnParticle(state.pos.x+32, state.pos.y+28), i*40);
      if(state.lvl===5) unlockAchievement('lvl5','Veteran');
      if(state.lvl===10) unlockAchievement('lvl10','Alpha');
    } else {
      spawnFloat(act.t, state.pos.x+10, state.pos.y-10, '#fff');
    }
    preview.classList.add('wag');
    setTimeout(()=>preview.classList.remove('wag'),600);
    updateStats();
  });

  window.feedPet = function(){
    state.hunger = Math.min(100, state.hunger+25);
    spawnFloat('+25 HUNGER', state.pos.x+10, state.pos.y-10, '#0f0');
    spawnBubble('*chews*', state.pos.x+32, state.pos.y);
    updateStats();
  }

  let codeGenerated = false;
  
  function generate(){
    sync();
    codeGenerated = true; // FIX: Flag set BEFORE text update
    const safe = cfg.name.replace(/[^a-zA-Z0-9_]/g,'_');
    const theme = THEMES[cfg.theme];
    const phys = AGGRO_PHYSICS[cfg.aggro];
    const isLoyalty = cfg.mode === 'loyalty';
    
    const embed = `<!-- WOLF PET v4 -->
<style>.w-host{position:fixed;bottom:20px;right:20px;width:320px;height:220px;background:${theme.bg};border:1px solid #333;overflow:hidden;z-index:9999;font-family:monospace}.w-pet{position:absolute;width:64px;height:56px;cursor:grab;--pc:${theme.color};transition:transform .1s,filter .2s;user-select:none}.w-pet:active{cursor:grabbing}.w-pet svg{width:100%;height:100%;fill:var(--pc)}.w-pet .eye{fill:#000;opacity:.85}.w-pet:hover .eye{fill:var(--pc);opacity:1}.w-pet.hunt{filter:drop-shadow(0 0 8px var(--pc));animation:hp .4s infinite alternate}.w-pet.sleep{opacity:.5;filter:grayscale(.8)}.w-pet.happy{animation:hb .4s ease-in-out}.w-pet.angry{filter:drop-shadow(0 0 4px #f00)}.w-pet.wag .tail{animation:wag .3s infinite alternate}.w-pet.idle{animation:br 3s infinite ease-in-out}@keyframes hp{0%{filter:drop-shadow(0 0 4px var(--pc))}100%{filter:drop-shadow(0 0 12px var(--pc))}}@keyframes hb{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes wag{0%{transform:rotate(-15deg)}100%{transform:rotate(15deg)}}@keyframes br{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.04)}}.w-ui{position:absolute;top:6px;left:6px;background:#000d;padding:4px 6px;font-size:.55rem;color:${theme.color};border-radius:3px;border:1px solid #333;width:140px}.w-bar{height:3px;background:#222;border-radius:2px;margin:2px 0;overflow:hidden}.w-fill{height:100%;background:${theme.color};transition:width .3s}.w-wx{position:absolute;top:6px;right:6px;font-size:.6rem;color:#888}.w-ft{position:absolute;color:#fff;font-weight:bold;font-size:.7rem;pointer-events:none;animation:fu .7s forwards;text-shadow:0 0 4px #000;z-index:20}@keyframes fu{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-25px)}}.w-pt{position:absolute;width:4px;height:4px;background:var(--pc);border-radius:50%;pointer-events:none;animation:pt .6s forwards}@keyframes pt{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(0) translateY(-20px)}}.w-bb{position:absolute;background:#fff;color:#000;padding:4px 8px;border-radius:8px;font-size:.6rem;max-width:120px;text-align:center;animation:bf 2s forwards;z-index:15;box-shadow:0 2px 8px rgba(0,0,0,.3)}.w-bb::after{content:'';position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);border-width:4px 4px 0;border-style:solid;border-color:#fff transparent transparent transparent}@keyframes bf{0%{opacity:0;transform:translateY(5px)}10%{opacity:1;transform:translateY(0)}90%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-10px)}}.w-ach{position:absolute;bottom:6px;left:6px;background:linear-gradient(90deg,#0f42,#0a44);border:1px solid ${theme.color};padding:2px 5px;font-size:.55rem;color:${theme.color};border-radius:2px;animation:as .5s ease-out}@keyframes as{0%{transform:translateX(-100%)}100%{transform:translateX(0)}}.w-feed{position:absolute;bottom:6px;right:6px;background:#222;border:1px solid #444;color:#aaa;padding:2px 5px;font-size:.5rem;cursor:pointer;border-radius:2px}.w-feed:hover{background:#333;color:#fff}</style>
<div class="w-host" id="wh_${safe}">

if(s.l>=5)ach_('lvl5','Veteran');if(s.l>=10)ach_('lvl10','Alpha');

  function copyToClipboard(){
    const text = document.getElementById('embed-text').textContent;
    // FIX: Direct string comparison, no flags needed
    if(text === '[CÓDIGO EMBED AQUÍ]') {
      alert('⚠️ Genera el código primero pulsando "GENERAR EMBED"');
      return;
    }
    navigator.clipboard.writeText(text).then(()=>{
      const btn = document.querySelector('.copy-btn');
      btn.textContent = '✓ COPIADO';
      btn.style.background = '#00ff41';
      btn.style.color = '#000';
      btn.style.borderColor = '#00ff41';
      setTimeout(()=>{
        btn.textContent = 'COPIAR';
        btn.style.background = '#222';
        btn.style.color = '#aaa';
        btn.style.borderColor = '#444';
      }, 2000);
    }).catch(()=>{
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      const btn = document.querySelector('.copy-btn');
      btn.textContent = '✓ COPIADO';
      setTimeout(()=>btn.textContent='COPIAR',2000);
    });
  }
