<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WOLF PET // TACTICAL v3</title>
<style>
  :root{--bg:#0b0c10;--panel:#141619;--accent:#00ff41;--text:#8a8f98;--border:#2a2d32}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Courier New',monospace;padding:1.5rem;min-height:100vh}
  .container{max-width:750px;margin:0 auto}
  h1{color:var(--accent);text-transform:uppercase;letter-spacing:2px;font-size:1.3rem;margin:0 0 1rem;border-bottom:1px solid var(--border);padding-bottom:.6rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin:1rem 0}
  label{display:block;margin-bottom:.3rem;font-size:.7rem;color:#556;text-transform:uppercase}
  input,select{background:var(--panel);border:1px solid var(--border);color:var(--accent);padding:.5rem;width:100%;box-sizing:border-box;font-family:inherit}
  button{background:#1a1d22;border:1px solid var(--accent);color:var(--accent);padding:.6rem;width:100%;font-weight:bold;cursor:pointer;text-transform:uppercase;letter-spacing:1px;transition:all .2s;margin-top:.5rem}
  button:hover{background:var(--accent);color:#000}
  #preview{width:100%;height:280px;background:#0f1114;border:1px solid var(--border);position:relative;overflow:hidden;margin:1.2rem 0;border-radius:4px}
  #output-wrap{position:relative;background:#08090a;border:1px solid var(--border);padding:.8rem;border-radius:4px}
  #embed-text{margin:0;font-size:.65rem;color:#667;overflow-x:auto;white-space:pre-wrap;word-break:break-all;min-height:100px;max-height:180px}
  .copy-btn{position:absolute;top:.4rem;right:.4rem;background:#222;border:1px solid #444;color:#aaa;padding:.2rem .5rem;font-size:.6rem;cursor:pointer;border-radius:2px}
  .copy-btn:hover{background:#333;color:#fff}
  
  .wp-ui{position:absolute;top:8px;left:8px;background:#000d;padding:4px 8px;border-radius:3px;font-size:.6rem;color:var(--accent);pointer-events:none;border:1px solid #333;min-width:180px}
  .wp-pet{position:absolute;width:64px;height:56px;cursor:grab;--pc:#00ff41;transition:transform .1s,filter .2s;user-select:none;z-index:10}
  .wp-pet:active{cursor:grabbing}
  .wp-pet svg{width:100%;height:100%;fill:var(--pc);transition:fill .2s}
  .wp-pet .eye{fill:#000;opacity:.85}
  .wp-pet:hover .eye{fill:var(--pc);opacity:1}
  .wp-pet.hunt{filter:drop-shadow(0 0 8px var(--pc));animation:huntPulse .5s infinite alternate}
  .wp-pet.sleep{opacity:.5;filter:grayscale(.8)}
  .wp-pet.happy{animation:happyBounce .4s ease-in-out}
  .wp-pet.angry{filter:hue-rotate(0deg) drop-shadow(0 0 4px #ff0000)}
  .wp-pet .tail{transition:transform .2s}
  .wp-pet.wag .tail{animation:wag .3s infinite alternate}
  .wp-pet.idle{animation:breathe 3s infinite ease-in-out}
  @keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.04)}}
  @keyframes wag{0%{transform:rotate(-15deg)}100%{transform:rotate(15deg)}}
  @keyframes huntPulse{0%{filter:drop-shadow(0 0 4px var(--pc))}100%{filter:drop-shadow(0 0 12px var(--pc))}}
  @keyframes happyBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .float-text{position:absolute;color:#fff;font-weight:bold;font-size:.75rem;pointer-events:none;animation:floatUp .8s forwards;text-shadow:0 0 4px #000;z-index:20}
  @keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-30px)}}
  .particle{position:absolute;width:4px;height:4px;background:var(--pc);border-radius:50%;pointer-events:none;animation:particle .6s forwards}
  @keyframes particle{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(0) translateY(-20px)}}
  .bubble{position:absolute;background:#fff;color:#000;padding:4px 8px;border-radius:8px;font-size:.65rem;max-width:120px;text-align:center;animation:bubbleFade 2s forwards;z-index:15;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .bubble::after{content:'';position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);border-width:4px 4px 0;border-style:solid;border-color:#fff transparent transparent transparent}
  @keyframes bubbleFade{0%{opacity:0;transform:translateY(5px)}10%{opacity:1;transform:translateY(0)}90%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-10px)}}
  .weather{position:absolute;top:8px;right:8px;font-size:.7rem;color:#888;pointer-events:none}
  .achievement{position:absolute;bottom:8px;left:8px;background:linear-gradient(90deg,#00ff4122,#00ff4144);border:1px solid var(--accent);padding:3px 6px;font-size:.6rem;color:var(--accent);border-radius:3px;animation:achSlide .5s ease-out}
  @keyframes achSlide{0%{transform:translateX(-100%)}100%{transform:translateX(0)}}
</style>
</head>
<body>
<div class="container">
  <h1>WOLF PET // TACTICAL v3</h1>
  <div class="grid">
    <div><label>CALLSIGN</label><input id="name" type="text" value="ALPHA_01" maxlength="12"></div>
    <div><label>COLOR TÁCTICO</label><input id="color" type="color" value="#00ff41"></div>
    <div><label>AGRESIVIDAD</label><select id="aggro">
      <option value="low">Baja (Patrulla)</option>
      <option value="med" selected>Media (Caza)</option>
      <option value="high">Alta (Asalto)</option>
    </select></div>
    <div><label>TEMA</label><select id="theme">
      <option value="matrix">Matrix</option>
      <option value="fire">Fuego</option>
      <option value="ice">Hielo</option>
      <option value="gold">Oro</option>
    </select></div>
  </div>
  <button onclick="generate()">GENERAR EMBED</button>
  
  <div id="preview">
    <div class="wp-ui" id="preview-stats">LVL:1 | XP:0 | H:100% | M:Neutral</div>
    <div class="weather" id="preview-weather">☀️ Día</div>
    <div id="preview-wolf" class="wp-pet idle"></div>
  </div>
  
  <div id="output-wrap">
    <pre id="embed-text">[CÓDIGO EMBED AQUÍ]</pre>
    <button class="copy-btn" onclick="copyToClipboard()">COPIAR</button>
  </div>
</div>

<script>
  const WOLF_SVG = `<svg viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
    <path d="M88 32 L78 18 L68 28 L58 12 L48 22 L38 8 L28 22 L18 12 L8 32 L18 48 L12 64 L28 58 L38 72 L52 76 L66 72 L76 58 L92 64 L88 48 Z"/>
    <circle cx="38" cy="36" r="2.5" class="eye"/>
    <circle cx="62" cy="36" r="2.5" class="eye"/>
    <path d="M62 62 Q76 68 86 56" fill="none" stroke="var(--pc)" stroke-width="2.5" stroke-linecap="round" class="tail"/>
    <path d="M20 45 L30 42 M80 45 L70 42" fill="none" stroke="var(--pc)" stroke-width="1.5" opacity=".6"/>
  </svg>`;

  const THEMES = {
    matrix: {color:'#00ff41',bg:'#0f1114'},
    fire: {color:'#ff4400',bg:'#1a0a05'},
    ice: {color:'#00ccff',bg:'#05101a'},
    gold: {color:'#ffcc00',bg:'#1a1505'}
  };

  const MOODS = ['Neutral','Happy','Angry','Excited','Sleepy','Hungry'];
  const VOICE_LINES = {
    Neutral:['...','*sniff*','*yawn*'],
    Happy:['*wags tail*','Good boy!','*happy noises*'],
    Angry:['*growl*','Grrr...','*bare teeth*'],
    Excited:['*barks*','Let\'s go!','*excited*'],
    Sleepy:['*zzz*','...tired...','*snores*'],
    Hungry:['*whines*','Food...','*hungry sounds*']
  };
  
  const ACHIEVEMENTS = [
    {id:'first_pet',name:'First Contact',desc:'Pet your wolf for the first time'},
    {id:'level_5',name:'Veteran',desc:'Reach level 5'},
    {id:'level_10',name:'Alpha',desc:'Reach level 10'},
    {id:'full_hunger',name:'Well Fed',desc:'Keep hunger at 100% for 1 minute'},
    {id:'night_owl',name:'Night Owl',desc:'Play with your wolf at night'},
    {id:'clicks_50',name:'Dedicated',desc:'Click 50 times'}
  ];

  const preview = document.getElementById('preview-wolf');
  const area = document.getElementById('preview');
  const statsEl = document.getElementById('preview-stats');
  const weatherEl = document.getElementById('preview-weather');
  let cfg = { name:'ALPHA_01', color:'#00ff41', aggro:'med', theme:'matrix' };
  let state = { 
    lvl:1, xp:0, hunger:100, energy:100, mood:'Neutral', 
    pos:{x:100,y:100}, vel:{x:2,y:1}, dragging:false, 
    huntMode:false, isNight:false, clickCount:0, playTime:0,
    achievements:[]
  };
  let lastTime = 0, moodTimer = 0, weatherTimer = 0;

  function sync(){
    cfg.name = document.getElementById('name').value.replace(/\s/g,'_')||'PET';
    cfg.color = document.getElementById('color').value;
    cfg.aggro = document.getElementById('aggro').value;
    cfg.theme = document.getElementById('theme').value;
    const theme = THEMES[cfg.theme];
    preview.style.setProperty('--pc',theme.color);
    area.style.background = theme.bg;
    updateStats();
  }

  function updateStats(){
    statsEl.textContent = `LVL:${state.lvl}|XP:${state.xp}|H:${Math.floor(state.hunger)}%|M:${state.mood}`;
    weatherEl.textContent = state.isNight?'🌙 Noche':'☀️ Día';
  }

  function spawnParticle(x,y){
    for(let i=0;i<5;i++){
      const p=document.createElement('div');
      p.className='particle';
      p.style.left=(x+Math.random()*30)+'px';
      p.style.top=(y+Math.random()*30)+'px';
      p.style.setProperty('--pc',cfg.color);
      area.appendChild(p);
      setTimeout(()=>p.remove(),600);
    }
  }

  function spawnFloat(txt,x,y,color){
    const el=document.createElement('div');
    el.className='float-text';
    el.textContent=txt;
    el.style.left=x+'px';
    el.style.top=y+'px';
    if(color) el.style.color=color;
    area.appendChild(el);
    setTimeout(()=>el.remove(),800);
  }

  function spawnBubble(text,x,y){
    const b=document.createElement('div');
    b.className='bubble';
    b.textContent=text;
    b.style.left=(x-40)+'px';
    b.style.top=(y-30)+'px';
    area.appendChild(b);
    setTimeout(()=>b.remove(),2000);
  }

  function unlockAchievement(id){
    if(state.achievements.includes(id)) return;
    const ach = ACHIEVEMENTS.find(a=>a.id===id);
    if(!ach) return;
    state.achievements.push(id);
    const el=document.createElement('div');
    el.className='achievement';
    el.innerHTML=`🏆 ${ach.name}<br><small>${ach.desc}</small>`;
    area.appendChild(el);
    setTimeout(()=>el.remove(),3000);
  }

  function changeMood(newMood){
    state.mood = newMood;
    preview.classList.remove('happy','angry','sleep');
    if(newMood==='Happy') preview.classList.add('happy');
    else if(newMood==='Angry') preview.classList.add('angry');
    else if(newMood==='Sleepy') preview.classList.add('sleep');
  }

  ['input','change'].forEach(e=>{
    document.querySelectorAll('input,select').forEach(i=>i.addEventListener(e,sync));
  });

  function startPreview(){
    preview.innerHTML = WOLF_SVG;
    state.pos = {x:area.clientWidth/2-32, y:area.clientHeight/2-28};
    
    function loop(now){
      const dt = Math.min((now-lastTime)/1000, 0.1);
      lastTime = now;
      state.playTime += dt;
      
      if(!state.dragging){
        const speed = cfg.aggro==='high'?180:cfg.aggro==='med'?120:70;
        const changeChance = cfg.aggro==='high'?0.02:cfg.aggro==='med'?0.012:0.006;
        
        if(Math.random()<changeChance){
          state.vel.x = (Math.random()-.5)*speed;
          state.vel.y = (Math.random()-.5)*speed;
          state.huntMode = Math.random()<0.3;
          preview.classList.toggle('hunt',state.huntMode);
        }
        
        state.pos.x += state.vel.x * dt;
        state.pos.y += state.vel.y * dt;
        
        const mx=area.clientWidth-64, my=area.clientHeight-56;
        if(state.pos.x<=0){state.pos.x=0;state.vel.x*=-1}
        if(state.pos.x>=mx){state.pos.x=mx;state.vel.x*=-1}
        if(state.pos.y<=0){state.pos.y=0;state.vel.y*=-1}
        if(state.pos.y>=my){state.pos.y=my;state.vel.y*=-1}
        
        // Hunger & Energy decay
        state.hunger = Math.max(0, state.hunger - dt*1.5);
        state.energy = Math.max(0, state.energy - dt*0.8);
        
        // Mood system
        moodTimer += dt;
        if(moodTimer > 8){
          moodTimer = 0;
          if(state.hunger<30) changeMood('Hungry');
          else if(state.energy<20) changeMood('Sleepy');
          else if(Math.random()<0.4) changeMood('Happy');
          else if(Math.random()<0.2) changeMood('Angry');
          else changeMood('Neutral');
          
          // Voice bubble
          const lines = VOICE_LINES[state.mood];
          if(Math.random()<0.5) spawnBubble(lines[Math.floor(Math.random()*lines.length)], state.pos.x+32, state.pos.y);
        }
        
        // Day/Night cycle (30 sec)
        weatherTimer += dt;
        if(weatherTimer > 30){
          weatherTimer = 0;
          state.isNight = !state.isNight;
          area.style.filter = state.isNight?'brightness(0.6)':'brightness(1)';
          if(state.isNight) unlockAchievement('night_owl');
        }
        
        if(state.hunger<30) preview.classList.add('sleep');
        else preview.classList.remove('sleep');
        
        preview.style.left = state.pos.x+'px';
        preview.style.top = state.pos.y+'px';
        preview.style.transform = `scaleX(${state.vel.x>=0?1:-1})`;
        preview.classList.toggle('idle', Math.abs(state.vel.x)<10 && !state.huntMode);
        updateStats();
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }

  preview.addEventListener('mousedown',e=>{
    state.dragging=true;
    const r=area.getBoundingClientRect();
    state.dragOff = {x:e.clientX-r.left-state.pos.x, y:e.clientY-r.top-state.pos.y};
    preview.style.transition='none';
    preview.classList.remove('idle');
  });
  
  window.addEventListener('mouseup',()=>{
    if(state.dragging){
      state.dragging=false;
      preview.style.transition='transform .1s,filter .2s';
      state.vel = {x:(Math.random()-.5)*50, y:(Math.random()-.5)*50};
    }
  });
  
  window.addEventListener('mousemove',e=>{
    if(!state.dragging)return;
    const r=area.getBoundingClientRect();
    state.pos.x = e.clientX-r.left-state.dragOff.x;
    state.pos.y = e.clientY-r.top-state.dragOff.y;
    preview.style.left = state.pos.x+'px';
    preview.style.top = state.pos.y+'px';
  });

  preview.addEventListener('click',e=>{
    if(state.dragging)return;
    const rect=preview.getBoundingClientRect();
    const x=e.clientX-rect.left;
    const y=e.clientY-rect.top;
    
    state.clickCount++;
    if(state.clickCount>=50) unlockAchievement('clicks_50');
    
    spawnParticle(x+state.pos.x,y+state.pos.y);
    
    const actions = [
      {t:'PET +5XP',xp:5,h:-2,e:5,m:'Happy',v:'*happy*'},
      {t:'FEED +15',xp:10,h:20,e:-3,m:'Happy',v:'*nom nom*'},
      {t:'TRAIN +20',xp:20,h:-8,e:-12,m:'Excited',v:'Let\'s go!'}
    ];
    const act = actions[Math.floor(Math.random()*actions.length)];
    
    state.xp += act.xp;
    state.hunger = Math.min(100, state.hunger+act.h);
    state.energy = Math.min(100, state.energy+act.e);
    changeMood(act.m);
    spawnBubble(act.v, state.pos.x+32, state.pos.y);
    
    if(state.xp >= state.lvl*50){
      state.lvl++;
      state.xp = 0;
      spawnFloat('LEVEL UP!', state.pos.x+10, state.pos.y-30, '#00ff41');
      for(let i=0;i<15;i++) setTimeout(()=>spawnParticle(state.pos.x+32, state.pos.y+28), i*40);
      if(state.lvl===5) unlockAchievement('level_5');
      if(state.lvl===10) unlockAchievement('level_10');
    } else {
      spawnFloat(act.t, state.pos.x+10, state.pos.y-10, '#fff');
    }
    
    preview.classList.add('wag');
    setTimeout(()=>preview.classList.remove('wag'),600);
    updateStats();
  });

  let codeGenerated = false;
  
  function generate(){
    sync();
    const safe = cfg.name.replace(/[^a-zA-Z0-9_]/g,'_');
    const theme = THEMES[cfg.theme];
    const speed = cfg.aggro==='high'?220:cfg.aggro==='med'?140:80;
    const changeRate = cfg.aggro==='high'?0.025:cfg.aggro==='med'?0.015:0.008;
    
    const embed = `<!-- WOLF PET v3 -->

,0,0,.3)}.w-bb::after{content:'';position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);border-width:4px 4px 0;border-style:solid;border-color:#fff transparent transparent transparent}@keyframes bf{0%{opacity:0;transform:translateY(5px)}10%{opacity:1;transform:translateY(0)}90%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-10px)}}.w-ach{position:absolute;bottom:6px;left:6px;background:linear-gradient(90deg,#0f4,#0a4);border:1px solid ${theme.color};padding:2px 5px;font-size:.55rem;color:${theme.color};border-radius:2px;animation:as .5s ease-out}@keyframes as{0%{transform:translateX(-100%)}100%{transform:translateX(0)}}</style>
<div class="w-host" id="wh_${safe}"><div class="w-ui" id="wu_${safe}">LVL:1|XP:0|H:100%</div><div class="w-wx" id="ww_${safe}">☀️</div><div id="w_${safe}" class="w-pet idle">${WOLF_SVG}</div></div>
<script>(function(){
var h=document.getElementById('wh_${safe}'),w=document.getElementById('w_${safe}'),u=document.getElementById('wu_${safe}'),wx=document.getElementById('ww_${safe}'),
k='wp_${safe}',s=JSON.parse(localStorage.getItem(k)||'{"l":1,"x":0,"h":100,"e":100,"c":0}'),
p={x:s.x||h.clientWidth-80,y:s.y||h.clientHeight-70},v={x:2,y:1},d=false,do_={x:0,y:0},sp=${speed},cr=${changeRate},
mt=0,wt=0,night=false,ach=s.ach||[];
function sv(){localStorage.setItem(k,JSON.stringify({l:s.l,x:p.x,y:p.y,h:s.h,e:s.e,c:s.c,ach:ach}))}
function ft(t,x,y){var e=document.createElement('div');e.className='w-ft';e.textContent=t;e.style.left=x+'px';e.style.top=y+'px';h.appendChild(e);setTimeout(()=>e.remove(),700)}
function pt(x,y){for(var i=0;i<5;i++){var e=document.createElement('div');e.className='w-pt';e.style.left=(x+Math.random()*30)+'px';e.style.top=(y+Math.random()*30)+'px';h.appendChild(e);setTimeout(()=>e.remove(),600)}}
function bb(t,x,y){var e=document.createElement('div');e.className='w-bb';e.textContent=t;e.style.left=(x-40)+'px';e.style.top=(y-30)+'px';h.appendChild(e);setTimeout(()=>e.remove(),2000)}
function ach_(id,n,d){if(ach.includes(id))return;ach.push(id);var e=document.createElement('div');e.className='w-ach';e.innerHTML='🏆 '+n;h.appendChild(e);setTimeout(()=>e.remove(),3000)}
function up(){u.textContent='LVL:'+s.l+'|XP:'+(s.x||0)+'|H:'+Math.floor(s.h||100)+'%';wx.textContent=night?'🌙':'️'}
var vls={N:['...','*sniff*'],H:['*wags*','Good!'],A:['*growl*','Grr...'],E:['*barks*','Go!'],S:['*zzz*','...'],G:['Food...','*whine*']};
function mood(m){if(m==='H'){w.classList.add('happy');setTimeout(()=>w.classList.remove('happy'),400)}else if(m==='A')w.classList.add('angry');else if(m==='S')w.classList.add('sleep');else{w.classList.remove('happy','angry','sleep')}}
function loop(n){
if(!d){if(Math.random()<cr){v.x=(Math.random()-.5)*sp;v.y=(Math.random()-.5)*sp;w.classList.toggle('hunt',Math.random()<.3)}
