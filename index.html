<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WOLF PET // TACTICAL UPGRADE</title>
<style>
  :root{--bg:#0b0c10;--panel:#141619;--accent:#00ff41;--text:#8a8f98;--border:#2a2d32}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Courier New',monospace;padding:1.5rem;min-height:100vh}
  .container{max-width:700px;margin:0 auto}
  h1{color:var(--accent);text-transform:uppercase;letter-spacing:2px;font-size:1.2rem;margin:0 0 1rem;border-bottom:1px solid var(--border);padding-bottom:.6rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.8rem;margin:1rem 0}
  label{display:block;margin-bottom:.3rem;font-size:.7rem;color:#556;text-transform:uppercase}
  input,select{background:var(--panel);border:1px solid var(--border);color:var(--accent);padding:.5rem;width:100%;box-sizing:border-box;font-family:inherit}
  button{background:#1a1d22;border:1px solid var(--accent);color:var(--accent);padding:.6rem;width:100%;font-weight:bold;cursor:pointer;text-transform:uppercase;letter-spacing:1px;transition:all .2s}
  button:hover{background:var(--accent);color:#000}
  #preview{width:100%;height:240px;background:#0f1114;border:1px solid var(--border);position:relative;overflow:hidden;margin:1.2rem 0;border-radius:4px;cursor:crosshair}
  #output-wrap{position:relative;background:#08090a;border:1px solid var(--border);padding:.8rem;border-radius:4px}
  #embed-text{margin:0;font-size:.65rem;color:#667;overflow-x:auto;white-space:pre-wrap;word-break:break-all;min-height:100px;max-height:160px}
  .copy-btn{position:absolute;top:.4rem;right:.4rem;background:#222;border:1px solid #444;color:#aaa;padding:.2rem .5rem;font-size:.6rem;cursor:pointer;border-radius:2px}
  .copy-btn:hover{background:#333;color:#fff}
  
  /* Preview UI */
  .wp-ui-overlay{position:absolute;top:8px;left:8px;background:#00000099;padding:4px 8px;border-radius:3px;font-size:.65rem;color:var(--accent);pointer-events:none}
  .wp-pet{position:absolute;width:64px;height:56px;cursor:grab;--pc:#00ff41;transition:transform .1s,filter .2s;user-select:none}
  .wp-pet:active{cursor:grabbing}
  .wp-pet svg{width:100%;height:100%;fill:var(--pc);transition:fill .2s}
  .wp-pet .eye{fill:#000;opacity:.85}
  .wp-pet:hover .eye{fill:var(--pc);opacity:1}
  .wp-pet .tail{transition:transform .2s}
  .wp-pet.wag .tail{animation:wag .3s infinite alternate}
  .wp-pet.idle{animation:breathe 3s infinite ease-in-out}
  @keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.04)}}
  @keyframes wag{0%{transform:rotate(-15deg)}100%{transform:rotate(15deg)}}
  .float-text{position:absolute;color:#fff;font-weight:bold;font-size:.8rem;pointer-events:none;animation:floatUp .8s forwards;text-shadow:0 0 4px #000}
  @keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-30px)}}
</style>
</head>
<body>
<div class="container">
  <h1>WOLF PET // TACTICAL UPGRADE</h1>
  <div class="grid">
    <div><label>CALLSIGN</label><input id="name" type="text" value="ALPHA_01" maxlength="12"></div>
    <div><label>COLOR TÁCTICO</label><input id="color" type="color" value="#00ff41"></div>
    <div><label>ENTORNO</label><select id="env">
      <option value="forest">Bosque Táctico</option>
      <option value="urban">Zona Urbana</option>
      <option value="tundra">Tundra Ártica</option>
      <option value="custom">URL Personalizada</option>
    </select></div>
    <div id="custom-url-wrap" style="display:none"><label>URL FONDO</label><input id="env-url" type="text" placeholder="https://..."></div>
  </div>
  <button onclick="generate()">GENERAR EMBED</button>
  
  <div id="preview">
    <div class="wp-ui-overlay" id="preview-stats">LVL:1 | XP:0 | LEALTAD:100%</div>
    <div id="preview-wolf" class="wp-pet idle"></div>
  </div>
  
  <div id="output-wrap">
    <pre id="embed-text">[CÓDIGO EMBED AQUÍ]</pre>
    <button class="copy-btn" onclick="copyEmbed()">COPIAR</button>
  </div>
</div>

<script>
  const WOLF = `<svg viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
    <path d="M88 32 L78 18 L68 28 L58 12 L48 22 L38 8 L28 22 L18 12 L8 32 L18 48 L12 64 L28 58 L38 72 L52 76 L66 72 L76 58 L92 64 L88 48 Z"/>
    <circle cx="38" cy="36" r="2.5" class="eye"/>
    <circle cx="62" cy="36" r="2.5" class="eye"/>
    <path d="M62 62 Q76 68 86 56" fill="none" stroke="var(--pc)" stroke-width="2.5" stroke-linecap="round" class="tail"/>
    <path d="M20 45 L30 42 M80 45 L70 42" fill="none" stroke="var(--pc)" stroke-width="1.5" opacity=".6" class="whisker"/>
  </svg>`;

  const ENV_CSS = {
    forest: `background:linear-gradient(180deg,#0a150a 0%,#050a05 100%)`,
    urban: `background:linear-gradient(180deg,#111 0%,#050505 100%)`,
    tundra: `background:linear-gradient(180deg,#0a1520 0%,#02050a 100%)`,
    custom: ``
  };

  const preview = document.getElementById('preview-wolf');
  const area = document.getElementById('preview');
  const statsEl = document.getElementById('preview-stats');
  let cfg = { name:'ALPHA_01', color:'#00ff41', env:'forest', envUrl:'' };
  let state = { lvl:1, xp:0, loyalty:100, pos:{x:100,y:100}, vel:{x:0,y:0}, dragging:false, dragOff:{x:0,y:0} };
  
  function sync(){
    cfg.name = document.getElementById('name').value.replace(/\s/g,'_')||'PET';
    cfg.color = document.getElementById('color').value;
    cfg.env = document.getElementById('env').value;
    cfg.envUrl = document.getElementById('env-url').value;
    document.getElementById('custom-url-wrap').style.display = cfg.env==='custom'?'block':'none';
    preview.style.setProperty('--pc',cfg.color);
    applyEnv(area);
    updateStatsUI();
  }

  function applyEnv(el){
    el.style.background = cfg.env==='custom' && cfg.envUrl ? `url(${cfg.envUrl}) center/cover no-repeat` : ENV_CSS[cfg.env];
  }

  function updateStatsUI(){
    statsEl.textContent = `LVL:${state.lvl} | XP:${state.xp}/${state.lvl*50} | LEALTAD:${state.loyalty}%`;
  }

  function spawnFloat(txt,x,y){
    const el=document.createElement('div');
    el.className='float-text'; el.textContent=txt;
    el.style.left=x+'px'; el.style.top=y+'px';
    area.appendChild(el); setTimeout(()=>el.remove(),800);
  }

  ['input','change'].forEach(e=>{
    document.querySelectorAll('input,select').forEach(i=>i.addEventListener(e,sync));
  });

  // Preview Physics & Interaction
  function startPreviewLoop(){
    preview.innerHTML = WOLF;
    let last=performance.now();
    function loop(now){
      if(state.dragging){requestAnimationFrame(loop);return;}
      const dt=(now-last)/1000; last=now;
      state.vel.x+=(Math.random()-.5)*80*dt;
      state.vel.y+=(Math.random()-.5)*80*dt;
      state.vel.x*=.94; state.vel.y*=.94;
      state.pos.x+=state.vel.x*dt; state.pos.y+=state.vel.y*dt;
      const mx=area.clientWidth-64, my=area.clientHeight-56;
      if(state.pos.x<0){state.pos.x=0;state.vel.x*=-.6}
      if(state.pos.x>mx){state.pos.x=mx;state.vel.x*=-.6}
      if(state.pos.y<0){state.pos.y=0;state.vel.y*=-.6}
      if(state.pos.y>my){state.pos.y=my;state.vel.y*=-.6}
      preview.style.left=state.pos.x+'px'; preview.style.top=state.pos.y+'px';
      preview.style.transform=`scaleX(${state.vel.x>=0?1:-1})`;
      preview.classList.toggle('idle',Math.abs(state.vel.x)<2);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }

  // Drag & Click Logic
  preview.addEventListener('mousedown',e=>{
    state.dragging=true;
    const r=area.getBoundingClientRect();
    state.dragOff.x=e.clientX-r.left-state.pos.x;
    state.dragOff.y=e.clientY-r.top-state.pos.y;
    preview.style.transition='none';
  });
  window.addEventListener('mouseup',()=>{
    if(state.dragging){state.dragging=false;preview.style.transition='transform .1s,filter .2s';}
  });
  window.addEventListener('mousemove',e=>{
    if(!state.dragging)return;
    const r=area.getBoundingClientRect();
    state.pos.x=e.clientX-r.left-state.dragOff.x;
    state.pos.y=e.clientY-r.top-state.dragOff.y;
    preview.style.left=state.pos.x+'px'; preview.style.top=state.pos.y+'px';
  });
  
  preview.addEventListener('click',e=>{
    if(state.dragging)return;
    const acts=[
      {t:'Feed',x:10,l:5},
      {t:'Pet',x:5,l:3},
      {t:'Command',x:15,l:0}
    ];
    const a=acts[Math.floor(Math.random()*acts.length)];
    state.xp+=a.x; state.loyalty=Math.min(100,state.loyalty+a.l);
    preview.classList.add('wag'); setTimeout(()=>preview.classList.remove('wag'),600);
    spawnFloat(`+${a.x}XP`,state.pos.x+10,state.pos.y-10);
    if(state.xp>=state.lvl*50){
      state.lvl++; state.xp=0;
      spawnFloat('LEVEL UP!',state.pos.x,state.pos.y-30);
    }
    updateStatsUI();
  });

  function generate(){
    sync();
    const safe=cfg.name.replace(/[^a-zA-Z0-9_]/g,'_');
    const bgCSS = cfg.env==='custom' && cfg.envUrl ? `background:url('${cfg.envUrl}') center/cover no-repeat;` : ENV_CSS[cfg.env]+';';
    const embed=`<!-- WOLF PET TACTICAL -->
<style>.w-pet-host{position:fixed;bottom:20px;right:20px;width:300px;height:200px;border:1px solid #333;overflow:hidden;z-index:9999;font-family:monospace;${bgCSS}}
.w-pet{position:absolute;width:64px;height:56px;cursor:grab;--pc:${cfg.color};transition:transform .1s,filter .2s;user-select:none}
.w-pet:active{cursor:grabbing}.w-pet svg{width:100%;height:100%;fill:var(--pc)}.w-pet .eye{fill:#000;opacity:.85}.w-pet:hover .eye{fill:var(--pc);opacity:1}
.w-pet .tail{transition:transform .2s}.w-pet.wag .tail{animation:wag .3s infinite alternate}
.w-pet.idle{animation:breathe 3s infinite ease-in-out}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.04)}}@keyframes wag{0%{transform:rotate(-15deg)}100%{transform:rotate(15deg)}}
.w-ui{position:absolute;top:6px;left:6px;background:#000a;padding:3px 6px;font-size:.6rem;color:var(--pc);border-radius:3px;pointer-events:none}
.w-ft{position:absolute;color:#fff;font-weight:bold;font-size:.7rem;pointer-events:none;animation:fu .7s forwards;text-shadow:0 0 4px #000}
@keyframes fu{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-25px)}}</style>
<div class="w-pet-host" id="wh_${safe}"><div class="w-ui" id="wu_${safe}">LVL:1|XP:0|LOY:100%</div><div id="w_${safe}" class="w-pet idle">${WOLF}</div></div>
<script>(function(){
var h=document.getElementById('wh_${safe}'),w=document.getElementById('w_${safe}'),u=document.getElementById('wu_${safe}'),
k='wp_'+ '${safe}',s=JSON.parse(localStorage.getItem(k)||'{\"l\":1,\"x\":0,\"y\":100}'),
p={x:s.x||h.clientWidth-80,y:s.y||h.clientHeight-70},v={x:0,y:0},d=false,do={x:0,y:0},lt=0;
function sv(){localStorage.setItem(k,JSON.stringify({l:s.l,x:p.x,y:p.y}))}
function ft(t,x,y){var e=document.createElement('div');e.className='w-ft';e.textContent=t;e.style.left=x+'px';e.style.top=y+'px';h.appendChild(e);setTimeout(()=>e.remove(),700)}
function up(){u.textContent='LVL:'+s.l+'|XP:'+s.x+'|LOY:'+(s.lo||100)+'%'}
function loop(n){
if(!d){var dt=(n-lt)/1000;lt=n;v.x+=(Math.random()-.5)*60*dt;v.y+=(Math.random()-.5)*60*dt;v.x*=.94;v.y*=.94;
p.x+=v.x*dt;p.y+=v.y*dt;
var mx=h.clientWidth-64,my=h.clientHeight-56;
if(p.x<0){p.x=0;v.x*=-.6}if(p.x>mx){p.x=mx;v.x*=-.6}
if(p.y<0){p.y=0;v.y*=-.6}if(p.y>my){p.y=my;v.y*=-.6}
w.style.left=p.x+'px';w.style.top=p.y+'px';
w.style.transform='scaleX('+(v.x>=0?1:-1)+')';
w.classList.toggle('idle',Math.abs(v.x)<2)}
sv();requestAnimationFrame(loop)}
w.addEventListener('mousedown',e=>{d=true;var r=h.getBoundingClientRect();do.x=e.clientX-r.left-p.x;do.y=e.clientY-r.top-p.y;w.style.transition='none'});
window.addEventListener('mouseup',()=>{if(d){d=false;w.style.transition='transform .1s'}});
window.addEventListener('mousemove',e=>{if(!d)return;var r=h.getBoundingClientRect();p.x=e.clientX-r.left-do.x;p.y=e.clientY-r.top-do.y;w.style.left=p.x+'px';w.style.top=p.y+'px'});
w.addEventListener('click',()=>{if(d)return;var a=[{t:'+10XP',x:10,l:5},{t:'+5XP',x:5,l:3},{t:'CMD',x:15,l:0}],c=a[Math.floor(Math.random()*a.length)];
s.x=(s.x||0)+c.x;s.lo=Math.min(100,(s.lo||100)+c.l);
if(s.x>=s.l*50){s.l++;s.x=0;ft('LEVEL UP!',p.x,p.y-25)}
w.classList.add('wag');setTimeout(()=>w.classList.remove('wag'),500);ft(c.t,p.x+5,p.y-5);up()});
up();requestAnimationFrame(loop);
})();<\/script><!-- END WOLF PET -->`;
    document.getElementById('embed-text').textContent=embed;
  }

  function copyEmbed(){
    const t=document.getElementById('embed-text').textContent;
    if(t.includes('['))return;
    navigator.clipboard.writeText(t).then(()=>{
      const b=document.querySelector('.copy-btn');b.textContent='COPIADO';setTimeout(()=>b.textContent='COPIAR',1500);
    });
  }

  sync(); startPreviewLoop();
</script>
</body></html>
