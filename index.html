<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WOLF PET // TACTICAL v2</title>
<style>
  :root{--bg:#0b0c10;--panel:#141619;--accent:#00ff41;--text:#8a8f98;--border:#2a2d32}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Courier New',monospace;padding:1.5rem;min-height:100vh}
  .container{max-width:700px;margin:0 auto}
  h1{color:var(--accent);text-transform:uppercase;letter-spacing:2px;font-size:1.2rem;margin:0 0 1rem;border-bottom:1px solid var(--border);padding-bottom:.6rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.8rem;margin:1rem 0}
  label{display:block;margin-bottom:.3rem;font-size:.7rem;color:#556;text-transform:uppercase}
  input,select{background:var(--panel);border:1px solid var(--border);color:var(--accent);padding:.5rem;width:100%;box-sizing:border-box;font-family:inherit}
  button{background:#1a1d22;border:1px solid var(--accent);color:var(--accent);padding:.6rem;width:100%;font-weight:bold;cursor:pointer;text-transform:uppercase;letter-spacing:1px;transition:all .2s;margin-top:.5rem}
  button:hover{background:var(--accent);color:#000}
  #preview{width:100%;height:260px;background:#0f1114;border:1px solid var(--border);position:relative;overflow:hidden;margin:1.2rem 0;border-radius:4px}
  #output-wrap{position:relative;background:#08090a;border:1px solid var(--border);padding:.8rem;border-radius:4px}
  #embed-text{margin:0;font-size:.65rem;color:#667;overflow-x:auto;white-space:pre-wrap;word-break:break-all;min-height:100px;max-height:160px}
  .copy-btn{position:absolute;top:.4rem;right:.4rem;background:#222;border:1px solid #444;color:#aaa;padding:.2rem .5rem;font-size:.6rem;cursor:pointer;border-radius:2px}
  .copy-btn:hover{background:#333;color:#fff}
  
  .wp-ui{position:absolute;top:8px;left:8px;background:#000c;padding:4px 8px;border-radius:3px;font-size:.65rem;color:var(--accent);pointer-events:none;border:1px solid #333}
  .wp-pet{position:absolute;width:64px;height:56px;cursor:grab;--pc:#00ff41;transition:transform .1s,filter .2s;user-select:none;z-index:10}
  .wp-pet:active{cursor:grabbing}
  .wp-pet svg{width:100%;height:100%;fill:var(--pc);transition:fill .2s}
  .wp-pet .eye{fill:#000;opacity:.85}
  .wp-pet:hover .eye{fill:var(--pc);opacity:1}
  .wp-pet.hunt{filter:drop-shadow(0 0 6px var(--pc))}
  .wp-pet.sleep{opacity:.6;filter:grayscale(.8)}
  .wp-pet .tail{transition:transform .2s}
  .wp-pet.wag .tail{animation:wag .3s infinite alternate}
  .wp-pet.idle{animation:breathe 3s infinite ease-in-out}
  @keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.04)}}
  @keyframes wag{0%{transform:rotate(-15deg)}100%{transform:rotate(15deg)}}
  .float-text{position:absolute;color:#fff;font-weight:bold;font-size:.75rem;pointer-events:none;animation:floatUp .8s forwards;text-shadow:0 0 4px #000;z-index:20}
  @keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-30px)}}
  .particle{position:absolute;width:4px;height:4px;background:var(--pc);border-radius:50%;pointer-events:none;animation:particle .6s forwards}
  @keyframes particle{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(0) translateY(-20px)}}
</style>
</head>
<body>
<div class="container">
  <h1>WOLF PET // TACTICAL v2</h1>
  <div class="grid">
    <div><label>CALLSIGN</label><input id="name" type="text" value="ALPHA_01" maxlength="12"></div>
    <div><label>COLOR TÁCTICO</label><input id="color" type="color" value="#00ff41"></div>
    <div><label>AGRESIVIDAD</label><select id="aggro">
      <option value="low">Baja (Patrulla)</option>
      <option value="med" selected>Media (Caza)</option>
      <option value="high">Alta (Asalto)</option>
    </select></div>
  </div>
  <button onclick="generate()">GENERAR EMBED</button>
  
  <div id="preview">
    <div class="wp-ui" id="preview-stats">LVL:1 | XP:0 | HUNGER:100%</div>
    <div id="preview-wolf" class="wp-pet idle"></div>
  </div>
  
  <div id="output-wrap">
    <pre id="embed-text">[CÓDIGO EMBED AQUÍ]</pre>
    <button class="copy-btn" onclick="copyToClipboard()">COPIAR</button>
  </div>
</div>

<script>
  const WOLF_SVG = `<svg viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
    <path d="M88 32 L78 18 L68 28 L58 12 L48 22 L38 8 L28 22 L18 12 L8 32 L18 48 L12 64 L28 58 L38 72 L52 76 L66 72 L76 58 L92 64 L88 48 Z"/>
    <circle cx="38" cy="36" r="2.5" class="eye"/>
    <circle cx="62" cy="36" r="2.5" class="eye"/>
    <path d="M62 62 Q76 68 86 56" fill="none" stroke="var(--pc)" stroke-width="2.5" stroke-linecap="round" class="tail"/>
    <path d="M20 45 L30 42 M80 45 L70 42" fill="none" stroke="var(--pc)" stroke-width="1.5" opacity=".6"/>
  </svg>`;

  const preview = document.getElementById('preview-wolf');
  const area = document.getElementById('preview');
  const statsEl = document.getElementById('preview-stats');
  let cfg = { name:'ALPHA_01', color:'#00ff41', aggro:'med' };
  let state = { lvl:1, xp:0, hunger:100, energy:100, pos:{x:100,y:100}, vel:{x:2,y:1}, dragging:false, huntMode:false };
  let lastTime = 0;

  function sync(){
    cfg.name = document.getElementById('name').value.replace(/\s/g,'_')||'PET';
    cfg.color = document.getElementById('color').value;
    cfg.aggro = document.getElementById('aggro').value;
    preview.style.setProperty('--pc',cfg.color);
    updateStats();
  }

  function updateStats(){
    statsEl.textContent = `LVL:${state.lvl}|XP:${state.xp}|HUNGER:${Math.floor(state.hunger)}%`;
  }

  function spawnParticle(x,y){
    const p=document.createElement('div');
    p.className='particle';
    p.style.left=x+'px'; p.style.top=y+'px';
    p.style.setProperty('--pc',cfg.color);
    area.appendChild(p);
    setTimeout(()=>p.remove(),600);
  }

  function spawnFloat(txt,x,y){
    const el=document.createElement('div');
    el.className='float-text'; el.textContent=txt;
    el.style.left=x+'px'; el.style.top=y+'px';
    area.appendChild(el); setTimeout(()=>el.remove(),800);
  }

  ['input','change'].forEach(e=>{
    document.querySelectorAll('input,select').forEach(i=>i.addEventListener(e,sync));
  });

  // Physics Loop
  function startPreview(){
    preview.innerHTML = WOLF_SVG;
    state.pos = {x:area.clientWidth/2, y:area.clientHeight/2};
    
    function loop(now){
      const dt = Math.min((now-lastTime)/1000, 0.1);
      lastTime = now;
      
      if(!state.dragging){
        const speed = cfg.aggro==='high'?150:cfg.aggro==='med'?100:60;
        const changeChance = cfg.aggro==='high'?0.02:cfg.aggro==='med'?0.01:0.005;
        
        // Random direction change
        if(Math.random()<changeChance){
          state.vel.x = (Math.random()-.5)*speed;
          state.vel.y = (Math.random()-.5)*speed;
          state.huntMode = Math.random()<0.3;
          preview.classList.toggle('hunt',state.huntMode);
        }
        
        // Apply velocity
        state.pos.x += state.vel.x * dt;
        state.pos.y += state.vel.y * dt;
        
        // Bounce
        const mx=area.clientWidth-64, my=area.clientHeight-56;
        if(state.pos.x<=0){state.pos.x=0;state.vel.x*=-1}
        if(state.pos.x>=mx){state.pos.x=mx;state.vel.x*=-1}
        if(state.pos.y<=0){state.pos.y=0;state.vel.y*=-1}
        if(state.pos.y>=my){state.pos.y=my;state.vel.y*=-1}
        
        // Decay hunger
        state.hunger = Math.max(0, state.hunger - dt*2);
        if(state.hunger<30) preview.classList.add('sleep');
        else preview.classList.remove('sleep');
        
        preview.style.left = state.pos.x+'px';
        preview.style.top = state.pos.y+'px';
        preview.style.transform = `scaleX(${state.vel.x>=0?1:-1})`;
        preview.classList.toggle('idle', Math.abs(state.vel.x)<10 && !state.huntMode);
        updateStats();
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }

  // Drag handlers
  preview.addEventListener('mousedown',e=>{
    state.dragging=true;
    const r=area.getBoundingClientRect();
    state.dragOff = {x:e.clientX-r.left-state.pos.x, y:e.clientY-r.top-state.pos.y};
    preview.style.transition='none';
    preview.classList.remove('idle');
  });
  
  window.addEventListener('mouseup',()=>{
    if(state.dragging){
      state.dragging=false;
      preview.style.transition='transform .1s,filter .2s';
      state.vel = {x:(Math.random()-.5)*50, y:(Math.random()-.5)*50};
    }
  });
  
  window.addEventListener('mousemove',e=>{
    if(!state.dragging)return;
    const r=area.getBoundingClientRect();
    state.pos.x = e.clientX-r.left-state.dragOff.x;
    state.pos.y = e.clientY-r.top-state.dragOff.y;
    preview.style.left = state.pos.x+'px';
    preview.style.top = state.pos.y+'px';
  });

  // Click interactions
  preview.addEventListener('click',e=>{
    if(state.dragging)return;
    const rect=preview.getBoundingClientRect();
    const x=e.clientX-rect.left;
    const y=e.clientY-rect.top;
    
    // Spawn particles
    for(let i=0;i<5;i++) spawnParticle(x+state.pos.x,y+state.pos.y);
    
    // Random action
    const actions = [
      {t:'PET +5XP',xp:5,h:-2,e:5},
      {t:'FEED +10',xp:10,h:15,e:-5},
      {t:'TRAIN +15',xp:15,h:-5,e:-10}
    ];
    const act = actions[Math.floor(Math.random()*actions.length)];
    
    state.xp += act.xp;
    state.hunger = Math.min(100, state.hunger+act.h);
    state.energy = Math.min(100, state.energy+act.e);
    
    // Level up check
    if(state.xp >= state.lvl*50){
      state.lvl++;
      state.xp = 0;
      spawnFloat('LEVEL UP!', state.pos.x+10, state.pos.y-30);
      for(let i=0;i<10;i++) setTimeout(()=>spawnParticle(state.pos.x+32, state.pos.y+28), i*50);
    } else {
      spawnFloat(act.t, state.pos.x+10, state.pos.y-10);
    }
    
    preview.classList.add('wag');
    setTimeout(()=>preview.classList.remove('wag'),600);
    updateStats();
  });

  function generate(){
    sync();
    const safe = cfg.name.replace(/[^a-zA-Z0-9_]/g,'_');
    const speed = cfg.aggro==='high'?200:cfg.aggro==='med'?120:70;
    const changeRate = cfg.aggro==='high'?0.025:cfg.aggro==='med'?0.012:0.006;
    
    const embed = `<!-- WOLF PET v2 -->
<style>.w-host{position:fixed;bottom:20px;right:20px;width:320px;height:220px;background:#0f1114;border:1px solid #333;overflow:hidden;z-index:9999;font-family:monospace}.w-pet{position:absolute;width:64px;height:56px;cursor:grab;--pc:${cfg.color};transition:transform .1s,filter .2s;user-select:none}.w-pet:active{cursor:grabbing}.w-pet svg{width:100%;height:100%;fill:var(--pc)}.w-pet .eye{fill:#000;opacity:.85}.w-pet:hover .eye{fill:var(--pc);opacity:1}.w-pet.hunt{filter:drop-shadow(0 0 6px var(--pc))}.w-pet.sleep{opacity:.6;filter:grayscale(.8)}.w-pet.wag .tail{animation:wag .3s infinite alternate}.w-pet.idle{animation:breathe 3s infinite ease-in-out}@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.04)}}@keyframes wag{0%{transform:rotate(-15deg)}100%{transform:rotate(15deg)}}.w-ui{position:absolute;top:6px;left:6px;background:#000c;padding:3px 6px;font-size:.6rem;color:var(--pc);border-radius:3px;border:1px solid #333}.w-ft{position:absolute;color:#fff;font-weight:bold;font-size:.7rem;pointer-events:none;animation:fu .7s forwards;text-shadow:0 0 4px #000;z-index:20}@keyframes fu{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-25px)}}.w-pt{position:absolute;width:4px;height:4px;background:var(--pc);border-radius:50%;pointer-events:none;animation:pt .6s forwards}@keyframes pt{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(0) translateY(-20px)}}</style>
<div class="w-host" id="wh_${safe}"><div class="w-ui" id="wu_${safe}">LVL:1|XP:0|H:100%</div><div id="w_${safe}" class="w-pet idle">${WOLF_SVG}</div></div>
<script>(function(){
var h=document.getElementById('wh_${safe}'),w=document.getElementById('w_${safe}'),u=document.getElementById('wu_${safe}'),
k='wp_${safe}',s=JSON.parse(localStorage.getItem(k)||'{"l":1,"x":0,"h":100}'),
p={x:s.x||h.clientWidth-80,y:s.y||h.clientHeight-70},v={x:2,y:1},d=false,do_={x:0,y:0},sp=${speed},cr=${changeRate};
function sv(){localStorage.setItem(k,JSON.stringify({l:s.l,x:p.x,y:p.y,h:s.h||100}))}
function ft(t,x,y){var e=document.createElement('div');e.className='w-ft';e.textContent=t;e.style.left=x+'px';e.style.top=y+'px';h.appendChild(e);setTimeout(()=>e.remove(),700)}
function pt(x,y){for(var i=0;i<5;i++){var e=document.createElement('div');e.className='w-pt';e.style.left=(x+Math.random()*20)+'px';e.style.top=(y+Math.random()*20)+'px';e.style.setProperty('--pc','${cfg.color}');h.appendChild(e);setTimeout(()=>e.remove(),600)}}
function up(){u.textContent='LVL:'+s.l+'|XP:'+(s.x||0)+'|H:'+Math.floor(s.h||100)+'%'}
function loop(n){
if(!d){if(Math.random()<cr){v.x=(Math.random()-.5)*sp;v.y=(Math.random()-.5)*sp;w.classList.toggle('hunt',Math.random()<.3)}
p.x+=v.x*.016;p.y+=v.y*.016;
var mx=h.clientWidth-64,my=h.clientHeight-56;
if(p.x<=0){p.x=0;v.x*=-1}if(p.x>=mx){p.x=mx;v.x*=-1}
if(p.y<=0){p.y=0;v.y*=-1}if(p.y>=my){p.y=my;v.y*=-1}
s.h=Math.max(0,(s.h||100)-.03);if(s.h<30)w.classList.add('sleep');else w.classList.remove('sleep');
w.style.left=p.x+'px';w.style.top=p.y+'px';w.style.transform='scaleX('+(v.x>=0?1:-1)+')';w.classList.toggle('idle',Math.abs(v.x)<10);sv();up()}
requestAnimationFrame(loop)}
w.addEventListener('mousedown',function(e){d=true;var r=h.getBoundingClientRect();do_.x=e.clientX-r.left-p.x;do_.y=e.clientY-r.top-p.y;w.style.transition='none';w.classList.remove('idle')});
window.addEventListener('mouseup',function(){if(d){d=false;w.style.transition='transform .1s,filter .2s';v.x=(Math.random()-.5)*50;v.y=(Math.random()-.5)*50}});
window.addEventListener('mousemove',function(e){if(!d)return;var r=h.getBoundingClientRect();p.x=e.clientX-r.left-do_.x;p.y=e.clientY-r.top-do_.y;w.style.left=p.x+'px';w.style.top=p.y+'px'});
w.addEventListener('click',function(e){if(d)return;var r=w.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;pt(x,y);
var a=[{t:'PET +5',x:5,h:-2},{t:'FEED +10',x:10,h:15},{t:'TRAIN +15',x:15,h:-5}],c=a[Math.floor(Math.random()*a.length)];
s.x=(s.x||0)+c.x;s.h=Math.min(100,(s.h||100)+c.h);
if(s.x>=s.l*50){s.l++;s.x=0;ft('LEVEL UP!',p.x+10,p.y-30);for(var i=0;i<10;i++)setTimeout(()=>pt(p.x+32,p.y+28),i*50)}
else ft(c.t,p.x+10,p.y-10);w.classList.add('wag');setTimeout(()=>w.classList.remove('wag'),600);up()});
up();requestAnimationFrame(loop);
})();<\/script><!-- END -->`;
    document.getElementById('embed-text').textContent = embed;
  }

  function copyToClipboard(){
    const text = document.getElementById('embed-text').textContent;
    if(text.includes('[')){
      alert('Genera el código primero');
      return;
    }
    navigator.clipboard.writeText(text).then(()=>{
      const btn = document.querySelector('.copy-btn');
      const original = btn.textContent;
      btn.textContent = '✓ COPIADO';
      btn.style.background = '#00ff41';
      btn.style.color = '#000';
      setTimeout(()=>{
        btn.textContent = original;
        btn.style.background = '#222';
        btn.style.color = '#aaa';
      }, 2000);
    }).catch(err=>{
      // Fallback
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      const btn = document.querySelector('.copy-btn');
      btn.textContent = '✓ COPIADO';
      setTimeout(()=>btn.textContent='COPIAR',2000);
    });
  }

  sync();
  startPreview();
</script>
</body></html>
